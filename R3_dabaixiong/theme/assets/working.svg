<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
    <linearGradient id="cookie-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="kb-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-js {
      animation: work-shadow 2.4s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-js {
      animation: work-body 2.4s ease-in-out infinite;
      transform-origin: 0px 16px;
    }
    #hands-typing {
      animation: hands-frenzy 2.4s ease-in-out infinite;
      transform-origin: 0px 12px;
    }
    #cookie-prop {
      animation: eat-cookie 2.4s ease-in-out infinite;
      transform-origin: 0px 14px;
    }
    #mouth-chew {
      animation: mouth-munch 2.4s ease-in-out infinite;
      transform-origin: 0px 2.5px;
    }
    #eyes-focus {
      animation: eyes-concentrate 2.4s ease-in-out infinite;
      transform-origin: 0px -1.5px;
    }
    @keyframes work-body {
      0%, 40%, 80%, 100% { transform: translateY(0) rotate(0deg); }
      5%, 15%, 25%, 35% { transform: translateY(0.3px) scale(1.01, 0.99); }
      10%, 20%, 30% { transform: translateY(-0.3px) scale(0.99, 1.01); }
      45%, 75% { transform: translateY(-0.8px) rotate(1deg); }
      55%, 65% { transform: translateY(-0.5px) rotate(-1deg); }
    }
    @keyframes work-shadow {
      0%, 100% { transform: scale(1, 1); opacity: 0.11; }
      50% { transform: scale(1.03, 1.03); opacity: 0.13; }
    }
    @keyframes hands-frenzy {
      0%, 40%, 80%, 100% { opacity: 1; transform: translateY(0); }
      2%, 6%, 10%, 14%, 18%, 22%, 26%, 30%, 34%, 38%,
      82%, 86%, 90%, 94%, 98% { transform: translateY(-1.2px); }
      4%, 8%, 12%, 16%, 20%, 24%, 28%, 32%, 36%,
      84%, 88%, 92%, 96% { transform: translateY(0.8px); }
      45%, 75% { opacity: 0; transform: translateY(3px); }
    }
    @keyframes eat-cookie {
      0%, 40%, 80%, 100% { opacity: 0; transform: scale(0) translateY(10px); }
      45% { opacity: 1; transform: scale(1) translate(0px, 4px) rotate(-10deg); }
      55% { opacity: 1; transform: scale(0.9) translate(0px, 1.5px) rotate(5deg); }
      65% { opacity: 1; transform: scale(0.5) translate(0px, 2px) rotate(0deg); }
      75% { opacity: 0; transform: scale(0) translate(0px, 2px); }
    }
    @keyframes mouth-munch {
      0%, 45%, 80%, 100% { transform: scale(1); }
      50%, 60%, 70% { transform: scale(1.35, 1.45); }
      55%, 65%, 75% { transform: scale(0.9, 0.85); }
    }
    @keyframes eyes-concentrate {
      0%, 40%, 80%, 100% { transform: translateY(0.6px) scale(1, 0.9); }
      45%, 75% { transform: translateY(-0.5px) scale(1.1, 1.1); }
    }
  </style>

  <g id="shadow-js">
    <ellipse cx="0" cy="18" rx="12" ry="2.3" fill="#000000"/>
  </g>

  <g id="body-js">
    <g id="feet">
      <ellipse id="foot-left" cx="-5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <ellipse id="foot-right" cx="5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <g id="torso">
      <path id="body-shape" d="
        M -11.5,16
        C -13.0,14 -12.5,4 -12.2,-5
        C -12.0,-11 -11.2,-15.2 -8.5,-16.8
        C -5.0,-17.5 5.0,-17.5 8.5,-16.8
        C 11.2,-15.2 12.0,-11 12.2,-5
        C 12.5,4 13.0,14 11.5,16
        C 7.5,17.8 -7.5,17.8 -11.5,16 Z"
        fill="url(#fur-grad)" stroke="#262422" stroke-width="1.05" stroke-linejoin="round"/>
    </g>

    <g id="straps">
      <path d="M -11.8,11 C -11.8,2 -10.2,-10 -8.5,-14.2 L -6.5,-13.5 C -8.2,-9.5 -9.8,2 -9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
      <path d="M 11.8,11 C 11.8,2 10.2,-10 8.5,-14.2 L 6.5,-13.5 C 8.2,-9.5 9.8,2 9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
    </g>

    <g id="ears-and-spikes">
      <path d="M -10.5,-14.5 C -13.6,-16.8 -12.5,-18.5 -8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="-12.2" y1="-16.0" x2="-13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 10.5,-14.5 C 13.6,-16.8 12.5,-18.5 8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="12.2" y1="-16.0" x2="13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -3.5,-17.2 Q -4.8,-19.5 -3.0,-19.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.2,-17.5 Q -1.5,-20.0 0,-18.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 1.8,-17.5 Q 2.5,-19.8 3.5,-18.2" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="forehead-bangs">
      <path d="M -5.2,-14.2 C -4.2,-10.8 -2.8,-9.0 -4.0,-6.0" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -1.5,-14.5 C -1.2,-11.5 -1.0,-9.5 -1.5,-6.5" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 2.8,-15.0 C 4.2,-11.2 3.8,-8.5 2.2,-5.2" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -5.0,-11.5 Q -4.2,-10.2 -4.8,-9.5" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
      <path d="M 3.2,-10.8 Q 3.8,-9.6 3.4,-8.8" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
    </g>

    <g id="eyes-focus">
      <circle cx="-6.5" cy="-1.8" r="0.75" fill="#262422"/>
      <circle cx="6.5" cy="-1.3" r="0.75" fill="#262422"/>
    </g>

    <g id="face-features">
      <line x1="-9.8" y1="-0.8" x2="-14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="-9.8" y1="1.4" x2="-14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="-0.8" x2="14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="1.4" x2="14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>

      <path d="M -1.3,-1.2 L 1.3,-1.2 Q 0,0.5 -1.3,-1.2 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.8" stroke-linejoin="round"/>
      <line x1="0" y1="0.3" x2="0" y2="1.5" stroke="#262422" stroke-width="0.8"/>

      <g id="mouth-chew">
        <path d="M -1.6,2.6 L 0,1.4 L 1.6,2.6 Q 0,3.2 -1.6,2.6 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.75" stroke-linejoin="round"/>
        <polygon points="-2.2,1.5 -1.5,2.5 -2.4,2.7" fill="#262422"/>
        <polygon points="2.2,1.5 1.5,2.5 2.4,2.7" fill="#262422"/>
        <polygon points="-0.3,3.3 0.3,3.3 0,3.9" fill="#262422"/>
      </g>

      <path d="M -3.2,9.6 Q 0,10.5 3.2,9.6" fill="none" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 偷吃曲奇道具 (eat-cookie 动画控制显现与塞嘴) -->
    <g id="cookie-prop">
      <circle cx="0" cy="5" r="2.6" fill="url(#cookie-grad)" stroke="#92400E" stroke-width="0.6"/>
      <circle cx="-0.8" cy="4.5" r="0.4" fill="#78350F"/>
      <circle cx="0.8" cy="4.2" r="0.35" fill="#78350F"/>
      <circle cx="0.2" cy="5.8" r="0.4" fill="#78350F"/>
    </g>

    <!-- 敲键盘打字机爪子残影 -->
    <g id="hands-typing">
      <ellipse cx="-4.5" cy="11.5" rx="2.5" ry="1.4" fill="#FFFFFF" stroke="#262422" stroke-width="0.85"/>
      <ellipse cx="4.5" cy="11.5" rx="2.5" ry="1.4" fill="#FFFFFF" stroke="#262422" stroke-width="0.85"/>
      <!-- 残影淡虚影 -->
      <ellipse cx="-4.8" cy="10.2" rx="2.2" ry="1.1" fill="rgba(255,255,255,0.4)" stroke="rgba(38,36,34,0.3)" stroke-width="0.6"/>
      <ellipse cx="4.8" cy="10.2" rx="2.2" ry="1.1" fill="rgba(255,255,255,0.4)" stroke="rgba(38,36,34,0.3)" stroke-width="0.6"/>
    </g>

    <!-- 迷你机械键盘 -->
    <g id="keyboard" transform="translate(0, 13)">
      <rect x="-8.5" y="0" width="17" height="4.5" rx="1.0" fill="url(#kb-grad)" stroke="#111827" stroke-width="0.75"/>
      <!-- 键帽矩阵 -->
      <rect x="-7.2" y="0.8" width="2.2" height="1.2" rx="0.3" fill="#E5E7EB"/>
      <rect x="-4.2" y="0.8" width="2.2" height="1.2" rx="0.3" fill="#E5E7EB"/>
      <rect x="-1.1" y="0.8" width="2.2" height="1.2" rx="0.3" fill="#E5E7EB"/>
      <rect x="2.0" y="0.8" width="2.2" height="1.2" rx="0.3" fill="#E5E7EB"/>
      <rect x="5.0" y="0.8" width="2.2" height="1.2" rx="0.3" fill="#E5E7EB"/>
      <!-- 空格行 -->
      <rect x="-4.5" y="2.5" width="9.0" height="1.2" rx="0.3" fill="#3B82F6"/>
    </g>
  </g>
</svg>
