<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
    <linearGradient id="cookie-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    #body-work {
      animation: work-shake 0.15s ease-in-out infinite alternate;
      transform-origin: 0px 18px;
    }
    #paw-l {
      animation: paws-fast-type 0.12s ease-in-out infinite alternate;
      transform-origin: -6px 11px;
    }
    #paw-r {
      animation: paws-fast-type 0.12s ease-in-out infinite alternate-reverse;
      transform-origin: 6px 11px;
    }
    #sparks {
      animation: spark-flash 0.24s steps(2) infinite;
    }
    #cookie-prop {
      animation: cookie-sneak-eat 3.6s ease-in-out infinite;
      transform-origin: 0px 4px;
    }
    #mouth-chew {
      animation: cheek-chew 3.6s ease-in-out infinite;
      transform-origin: 0px 4.5px;
    }
    @keyframes work-shake {
      0% { transform: translateY(0px) rotate(-0.4deg); }
      100% { transform: translateY(-0.5px) rotate(0.4deg); }
    }
    @keyframes paws-fast-type {
      0% { transform: translateY(-2px) rotate(12deg); }
      100% { transform: translateY(1.2px) rotate(-6deg); }
    }
    @keyframes spark-flash {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes cookie-sneak-eat {
      0%, 65%, 100% { transform: translateY(18px) scale(0); opacity: 0; }
      70% { transform: translateY(6px) scale(1); opacity: 1; }
      75%, 85% { transform: translate(1px, 3.5px) scale(0.9); opacity: 1; }
      90% { transform: translate(1px, 3.5px) scale(0); opacity: 0; }
    }
    @keyframes cheek-chew {
      0%, 74%, 100% { transform: scale(1, 1); }
      76%, 80%, 84%, 88% { transform: scale(1.18, 0.88); }
      78%, 82%, 86% { transform: scale(0.92, 1.12); }
    }
  </style>

  <g id="shadow-work">
    <ellipse cx="0" cy="18" rx="11.5" ry="2.2" fill="rgba(0,0,0,0.11)"/>
  </g>

  <g id="body-work">
    <g id="feet">
      <ellipse cx="-5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
      <ellipse cx="5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
    </g>

    <!-- 直筒柱身 -->
    <path d="
      M -11,16
      C -13,15 -12,2 -11.5,-6
      C -11.2,-13 -10.5,-18 -7,-20
      C -3,-21 3,-21 7,-20
      C 10.5,-18 11.2,-13 11.5,-6
      C 12,2 13,15 11,16
      C 7,18 -7,18 -11,16 Z"
      fill="url(#fur-grad)" stroke="#1E1B18" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- 浅蓝肩带 -->
    <g id="straps">
      <path d="M -11,10 C -11,1 -9.5,-12 -8,-16 L -6,-15 C -7.5,-11 -9,1 -9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
      <path d="M 11,10 C 11,1 9.5,-12 8,-16 L 6,-15 C 7.5,-11 9,1 9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
    </g>

    <!-- 头顶尖耳与杂毛 -->
    <g id="ears-and-spikes">
      <path d="M -10,-17 C -13,-20 -11,-22 -7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 10,-17 C 13,-20 11,-22 7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M -1,-21 Q 0,-23.5 1,-21" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
    </g>

    <!-- 额前刘海与汗滴 -->
    <g id="forehead-bangs">
      <path d="M -6.5,-16 C -5.5,-12 -3.5,-10 -5,-7" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -2.5,-16 C -2,-13 -1.5,-11 -2,-7.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 3.5,-17 C 5,-13 4.5,-10 3,-6.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <line x1="-5.2" y1="-13.5" x2="-5" y2="-12" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="4.2" y1="-13" x2="4.5" y2="-11.5" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 专注小黑眼 (紧盯键盘) -->
    <circle cx="-7.5" cy="-0.5" r="0.75" fill="#1E1B18"/>
    <circle cx="7.5" cy="-0.5" r="0.75" fill="#1E1B18"/>

    <!-- 面部胡须与粉鼻 -->
    <g id="face-features">
      <line x1="-10.5" y1="1" x2="-16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="-10.5" y1="3.2" x2="-15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="1" x2="16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="3.2" x2="15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.5,0.2 L 1.5,0.2 Q 0,2.0 -1.5,0.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.85"/>
      <line x1="0" y1="1.8" x2="0" y2="3.8" stroke="#1E1B18" stroke-width="0.85"/>
      <g id="mouth-chew">
        <path d="M -1.8,5.2 L 0,3.8 L 1.8,5.2 Q 0,5.8 -1.8,5.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.75"/>
        <polygon points="-2.6,3.6 -1.8,5.0 -2.9,5.2" fill="#1E1B18"/>
        <polygon points="2.6,3.6 1.8,5.0 2.9,5.2" fill="#1E1B18"/>
        <polygon points="-0.35,6.0 0.35,6.0 0,6.7" fill="#1E1B18"/>
      </g>
      <path d="M -3.2,9.8 Q 0,11.2 3.2,9.8" fill="none" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- 偷吃金黄曲奇饼干 -->
    <g id="cookie-prop">
      <circle cx="1" cy="4.5" r="2.0" fill="url(#cookie-grad)" stroke="#D97706" stroke-width="0.6"/>
      <circle cx="0.3" cy="4.0" r="0.35" fill="#78350F"/>
      <circle cx="1.5" cy="4.7" r="0.35" fill="#78350F"/>
    </g>

    <!-- 狂暴打字残影双小白爪 -->
    <g id="paw-l">
      <ellipse cx="-4.5" cy="12" rx="2.8" ry="1.5" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95"/>
    </g>
    <g id="paw-r">
      <ellipse cx="4.5" cy="12" rx="2.8" ry="1.5" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95"/>
    </g>

    <!-- 迷你机械键盘 -->
    <g id="keyboard">
      <rect x="-9" y="13" width="18" height="3.8" rx="1.0" fill="#334155" stroke="#1E293B" stroke-width="0.8"/>
      <line x1="-7.5" y1="14.5" x2="7.5" y2="14.5" stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="1.0 0.7"/>
      <line x1="-7.5" y1="15.8" x2="7.5" y2="15.8" stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="1.0 0.7"/>
    </g>

    <g id="sparks">
      <path d="M -7,11.5 L -9,9.5 M -8,12.5 L -10,13.5" stroke="#F59E0B" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 7,11.5 L 9,9.5 M 8,12.5 L 10,13.5" stroke="#F59E0B" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
