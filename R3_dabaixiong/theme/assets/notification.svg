<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    #body-notify {
      animation: jump-shock 1.6s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
      transform-origin: 0px 18px;
    }
    #shadow-notify {
      animation: shadow-shock 1.6s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
      transform-origin: 0px 18px;
    }
    #star-prop {
      animation: star-swing 0.8s ease-in-out infinite alternate;
      transform-origin: 0px -7px;
    }
    #star-sparks {
      animation: sparks-pulse 0.8s ease-in-out infinite alternate;
    }
    #ears-perk {
      animation: ears-alert 0.8s ease-in-out infinite alternate;
      transform-origin: 0px -20px;
    }

    @keyframes jump-shock {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      15% { transform: translateY(1.2px) scale(1.06, 0.94); }
      35% { transform: translateY(-4.5px) scale(0.95, 1.05); }
      55% { transform: translateY(0px) scale(1.08, 0.92); }
      70% { transform: translateY(-1.2px) scale(0.98, 1.02); }
      85% { transform: translateY(0px) scale(1, 1); }
    }
    @keyframes shadow-shock {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      15% { transform: scale(1.08); opacity: 1; }
      35% { transform: scale(0.68); opacity: 0.45; }
      55% { transform: scale(1.16); opacity: 1; }
      70% { transform: scale(0.92); opacity: 0.75; }
      85% { transform: scale(1); opacity: 0.9; }
    }
    @keyframes star-swing {
      0% { transform: rotate(-14deg) scale(1); }
      100% { transform: rotate(14deg) scale(1.1); }
    }
    @keyframes sparks-pulse {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes ears-alert {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.12); }
    }
  </style>

  <!-- 地面阴影 -->
  <g id="shadow-notify">
    <ellipse cx="0" cy="18" rx="11" ry="2.2" fill="rgba(0,0,0,0.12)"/>
  </g>

  <!-- 身体与装饰 -->
  <g id="body-notify">
    <g id="feet">
      <ellipse cx="-5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
      <ellipse cx="5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
    </g>

    <!-- 直筒柱身 -->
    <path d="
      M -11,16
      C -13,15 -12,2 -11.5,-6
      C -11.2,-13 -10.5,-18 -7,-20
      C -3,-21 3,-21 7,-20
      C 10.5,-18 11.2,-13 11.5,-6
      C 12,2 13,15 11,16
      C 7,18 -7,18 -11,16 Z"
      fill="url(#fur-grad)" stroke="#1E1B18" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- 浅蓝肩带 -->
    <g id="straps">
      <path d="M -11,10 C -11,1 -9.5,-12 -8,-16 L -6,-15 C -7.5,-11 -9,1 -9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
      <path d="M 11,10 C 11,1 9.5,-12 8,-16 L 6,-15 C 7.5,-11 9,1 9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
    </g>

    <!-- 头顶尖耳与杂毛 (惊喜欢呼竖耳) -->
    <g id="ears-perk">
      <path d="M -10,-17 C -13.5,-21 -11.5,-23 -7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.15" stroke-linecap="round"/>
      <path d="M 10,-17 C 13.5,-21 11.5,-23 7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.15" stroke-linecap="round"/>
      <path d="M -1,-21 Q 0,-24.5 1,-21" fill="none" stroke="#1E1B18" stroke-width="1.0" stroke-linecap="round"/>
    </g>

    <!-- 额前刘海与汗滴 -->
    <g id="forehead-bangs">
      <path d="M -6.5,-16 C -5.5,-12 -3.5,-10 -5,-7" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -2.5,-16 C -2,-13 -1.5,-11 -2,-7.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 3.5,-17 C 5,-13 4.5,-10 3,-6.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <line x1="-5.2" y1="-13.5" x2="-5" y2="-12" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="4.2" y1="-13" x2="4.5" y2="-11.5" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 惊喜大眼睛 -->
    <circle cx="-7.5" cy="-0.5" r="0.9" fill="#1E1B18"/>
    <circle cx="7.5" cy="-0.5" r="0.9" fill="#1E1B18"/>

    <!-- 面部胡须与粉鼻 -->
    <g id="face-features">
      <line x1="-10.5" y1="1" x2="-16" y2="0.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="-10.5" y1="3.2" x2="-15.5" y2="4.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="1" x2="16" y2="0.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="3.2" x2="15.5" y2="4.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.5,0.2 L 1.5,0.2 Q 0,2.0 -1.5,0.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.85"/>
      <line x1="0" y1="1.8" x2="0" y2="3.8" stroke="#1E1B18" stroke-width="0.85"/>
      
      <!-- 惊喜微张粉口与图腾三角 -->
      <g id="mouth-totem">
        <path d="M -2.0,5.0 L 0,3.5 L 2.0,5.0 Q 0,6.5 -2.0,5.0 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.8"/>
        <polygon points="-2.7,3.6 -1.8,5.0 -3.0,5.4" fill="#1E1B18"/>
        <polygon points="2.7,3.6 1.8,5.0 3.0,5.4" fill="#1E1B18"/>
        <polygon points="-0.4,6.2 0.4,6.2 0,7.0" fill="#1E1B18"/>
      </g>
      <path d="M -3.2,10.0 Q 0,11.5 3.2,10.0" fill="none" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- 双爪高举捧星 -->
    <g id="arms-raised">
      <path d="M -9,7 C -12,4 -11,-2 -6,-3 C -4,-1 -6,4 -7,8 Z" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95" stroke-linejoin="round"/>
      <circle cx="-5" cy="-3.5" r="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95"/>

      <path d="M 9,7 C 12,4 11,-2 6,-3 C 4,-1 6,4 7,8 Z" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95" stroke-linejoin="round"/>
      <circle cx="5" cy="-3.5" r="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95"/>
    </g>

    <!-- 高举挥舞的金黄五角星 -->
    <g id="star-prop">
      <!-- 经典五角星 -->
      <polygon points="0,-12 1.8,-6.5 7.5,-6.5 3.0,-2.5 4.8,3.2 0,-0.2 -4.8,3.2 -3.0,-2.5 -7.5,-6.5 -1.8,-6.5"
               fill="url(#star-grad)" stroke="#D97706" stroke-width="0.75" stroke-linejoin="round"/>
    </g>

    <!-- 四散闪烁星芒 -->
    <g id="star-sparks">
      <path d="M -9,-10 L -12,-11 M 9,-10 L 12,-11 M 0,-15 L 0,-18" stroke="#F59E0B" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="-8" cy="-14" r="0.6" fill="#FEF08A"/>
      <circle cx="8" cy="-14" r="0.6" fill="#FEF08A"/>
    </g>
  </g>
</svg>
