<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad-roam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-roam {
      animation: shadow-waddle 0.9s ease-in-out infinite alternate;
      transform-origin: 1px 18px;
    }
    #bear-body-roam {
      animation: waddle-body 0.9s ease-in-out infinite alternate;
      transform-origin: 0px 18px;
    }
    #leg-left {
      animation: step-feet-l 0.9s ease-in-out infinite;
      transform-origin: -4px 15px;
    }
    #leg-right {
      animation: step-feet-r 0.9s ease-in-out infinite;
      transform-origin: 5px 15px;
    }
    #arm-swing-left {
      animation: arm-swing-l 0.9s ease-in-out infinite;
      transform-origin: -6px 8px;
    }
    #arm-swing-right {
      animation: arm-swing-r 0.9s ease-in-out infinite;
      transform-origin: 6px 8px;
    }
    #bangs-bounce {
      animation: bangs-bob 0.45s ease-in-out infinite alternate;
      transform-origin: 4px -14px;
    }
    @keyframes waddle-body {
      0% { transform: rotate(-4deg) translateY(-0.6px); }
      100% { transform: rotate(4deg) translateY(0.6px); }
    }
    @keyframes shadow-waddle {
      0% { transform: scale(0.96, 1) translateX(-0.8px); }
      100% { transform: scale(1.04, 1) translateX(0.8px); }
    }
    @keyframes step-feet-l {
      0%, 100% { transform: rotate(14deg) translateY(-1.2px); }
      50% { transform: rotate(-14deg) translateY(0.4px); }
    }
    @keyframes step-feet-r {
      0%, 100% { transform: rotate(-14deg) translateY(0.4px); }
      50% { transform: rotate(14deg) translateY(-1.2px); }
    }
    @keyframes arm-swing-l {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(20deg); }
    }
    @keyframes arm-swing-r {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(-20deg); }
    }
    @keyframes bangs-bob {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg) translateY(-0.5px); }
    }
  </style>

  <g id="shadow-roam">
    <ellipse cx="1" cy="18" rx="11" ry="2.2" fill="rgba(0,0,0,0.11)"/>
  </g>

  <g id="bear-body-roam">
    <g id="leg-left">
      <ellipse cx="-4" cy="17" rx="3.0" ry="1.6" fill="#EFF2F5" stroke="#1E1B18" stroke-width="0.95"/>
    </g>
    <g id="arm-swing-left">
      <path d="M -6,8 Q -9,11 -7.5,14 Q -5,15 -5,12" fill="#EFF2F5" stroke="#1E1B18" stroke-width="0.95"/>
    </g>

    <!-- 直筒柱状侧面轮廓 (朝右) -->
    <path d="
      M -9,16
      C -11,14 -10,-4 -8.5,-12
      C -7.5,-17 0,-20 5,-19
      C 9,-18 11.5,-13 11.8,-6
      C 12.2,2 12.5,14 9,16
      C 5,18 -5,18 -9,16 Z"
      fill="url(#fur-grad-roam)" stroke="#1E1B18" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- 侧面肩带 -->
    <path d="M -3,6 L 2,12 L 4,11 L -1,5 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>

    <!-- 顶角耳簇与杂毛 -->
    <g id="ears-roam">
      <path d="M -5,-18 C -7,-21 -3,-22 -2,-18" fill="none" stroke="#1E1B18" stroke-width="1.05" stroke-linecap="round"/>
      <path d="M 5,-18 C 7,-22 10,-21 8,-17" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 0,-20 Q 1,-22 2,-20.5" fill="none" stroke="#1E1B18" stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- 侧面刘海波浪 -->
    <g id="bangs-bounce">
      <path d="M 2,-16 C 4,-12 5,-10 3,-7" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <line x1="4.5" y1="-12" x2="4.8" y2="-10.5" stroke="#1E1B18" stroke-width="0.75" stroke-linecap="round"/>
    </g>

    <!-- 侧视面部五官 (朝右注视) -->
    <g id="face-roam">
      <circle cx="7.5" cy="-1.5" r="0.75" fill="#1E1B18"/>
      <line x1="9" y1="1" x2="14" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="9" y1="3" x2="13.5" y2="3.4" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 9.5,-0.2 L 11.5,-0.2 Q 10.5,1.2 9.5,-0.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.8"/>
      <path d="M 9,4.2 L 10.5,3.6 L 10.2,4.8 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.7"/>
      <polygon points="10.8,3.5 10.2,4.5 11.0,4.6" fill="#1E1B18"/>
      <path d="M 5,9 Q 7.5,10.2 10,9.2" fill="none" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="leg-right">
      <ellipse cx="5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
    </g>
    <g id="arm-swing-right">
      <path d="M 6,8 Q 9,11 7.5,14 Q 5,15 5,12" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.05"/>
    </g>
  </g>
</svg>
