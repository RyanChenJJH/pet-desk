<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
  </defs>
  <style>
    #body-think {
      animation: think-tilt 2.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #paw-scratch {
      animation: paw-scratch-head 0.4s ease-in-out infinite alternate;
      transform-origin: 6px -4px;
    }
    #eye-l {
      animation: cross-eye-left 2.8s ease-in-out infinite;
    }
    #eye-r {
      animation: cross-eye-right 2.8s ease-in-out infinite;
    }
    #bubble-q {
      animation: bubble-float 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 5px -18px;
    }
    #steam-left {
      animation: steam-rise-l 2.8s ease-out infinite;
    }
    #steam-right {
      animation: steam-rise-r 2.8s ease-out infinite;
      animation-delay: 1.4s;
    }
    #shadow-think {
      animation: shadow-tilt 2.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }

    @keyframes think-tilt {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      30%, 70% { transform: rotate(-3.5deg) translateY(-0.6px); }
    }
    @keyframes shadow-tilt {
      0%, 100% { transform: scale(1); }
      30%, 70% { transform: scale(0.96) translateX(-0.5px); }
    }
    @keyframes paw-scratch-head {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-1.5px) rotate(8deg); }
    }
    @keyframes cross-eye-left {
      0%, 15%, 85%, 100% { transform: translateX(0px); }
      30%, 70% { transform: translateX(1.8px) translateY(0.4px); }
    }
    @keyframes cross-eye-right {
      0%, 15%, 85%, 100% { transform: translateX(0px); }
      30%, 70% { transform: translateX(-1.8px) translateY(0.4px); }
    }
    @keyframes bubble-float {
      0%, 15% { transform: translate(0px, 4px) scale(0); opacity: 0; }
      25% { transform: translate(0px, 0px) scale(1.1); opacity: 1; }
      30%, 65% { transform: translate(1px, -3px) scale(1); opacity: 0.95; }
      75% { transform: translate(2px, -6px) scale(1.15); opacity: 0; }
      100% { transform: translate(0px, 4px) scale(0); opacity: 0; }
    }
    @keyframes steam-rise-l {
      0%, 25% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
      40% { transform: translate(-1px, -3px) scale(0.9); opacity: 0.85; }
      60% { transform: translate(-3px, -7px) scale(1.3); opacity: 0; }
      100% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
    }
    @keyframes steam-rise-r {
      0%, 25% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
      40% { transform: translate(1px, -3px) scale(0.9); opacity: 0.85; }
      60% { transform: translate(3px, -7px) scale(1.3); opacity: 0; }
      100% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
    }
  </style>

  <!-- 地面阴影 -->
  <g id="shadow-think">
    <ellipse cx="0" cy="18" rx="11" ry="2.2" fill="rgba(0,0,0,0.11)"/>
  </g>

  <!-- 蒸气冒出 (CPU过载冒白烟) -->
  <g id="steam-left">
    <circle cx="-9" cy="-21" r="1.5" fill="#E2E8F0" opacity="0.8"/>
    <circle cx="-10.5" cy="-22" r="1.1" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g id="steam-right">
    <circle cx="9" cy="-21" r="1.5" fill="#E2E8F0" opacity="0.8"/>
    <circle cx="10.5" cy="-22" r="1.1" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- 身体与头部 -->
  <g id="body-think">
    <g id="feet">
      <ellipse cx="-5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
      <ellipse cx="5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
    </g>

    <!-- 直筒柱身 -->
    <path d="
      M -11,16
      C -13,15 -12,2 -11.5,-6
      C -11.2,-13 -10.5,-18 -7,-20
      C -3,-21 3,-21 7,-20
      C 10.5,-18 11.2,-13 11.5,-6
      C 12,2 13,15 11,16
      C 7,18 -7,18 -11,16 Z"
      fill="url(#fur-grad)" stroke="#1E1B18" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- 浅蓝肩带 -->
    <g id="straps">
      <path d="M -11,10 C -11,1 -9.5,-12 -8,-16 L -6,-15 C -7.5,-11 -9,1 -9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
      <path d="M 11,10 C 11,1 9.5,-12 8,-16 L 6,-15 C 7.5,-11 9,1 9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
    </g>

    <!-- 头顶尖耳与杂毛 -->
    <g id="ears-and-spikes">
      <path d="M -10,-17 C -13,-20 -11,-22 -7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 10,-17 C 13,-20 11,-22 7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M -1,-21 Q 0,-23.5 1,-21" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
    </g>

    <!-- 额前刘海与汗滴 -->
    <g id="forehead-bangs">
      <path d="M -6.5,-16 C -5.5,-12 -3.5,-10 -5,-7" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -2.5,-16 C -2,-13 -1.5,-11 -2,-7.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 3.5,-17 C 5,-13 4.5,-10 3,-6.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <line x1="-5.2" y1="-13.5" x2="-5" y2="-12" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="4.2" y1="-13" x2="4.5" y2="-11.5" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 斗鸡眼 (对眼聚焦) -->
    <g id="eye-l">
      <circle cx="-7.5" cy="-0.5" r="0.75" fill="#1E1B18"/>
    </g>
    <g id="eye-r">
      <circle cx="7.5" cy="-0.5" r="0.75" fill="#1E1B18"/>
    </g>

    <!-- 面部胡须与粉鼻 -->
    <g id="face-features">
      <line x1="-10.5" y1="1" x2="-16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="-10.5" y1="3.2" x2="-15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="1" x2="16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="3.2" x2="15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.5,0.2 L 1.5,0.2 Q 0,2.0 -1.5,0.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.85"/>
      <line x1="0" y1="1.8" x2="0" y2="3.8" stroke="#1E1B18" stroke-width="0.85"/>
      <g id="mouth-totem">
        <path d="M -1.8,5.2 L 0,3.8 L 1.8,5.2 Q 0,5.8 -1.8,5.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.75"/>
        <polygon points="-2.6,3.6 -1.8,5.0 -2.9,5.2" fill="#1E1B18"/>
        <polygon points="2.6,3.6 1.8,5.0 2.9,5.2" fill="#1E1B18"/>
        <polygon points="-0.35,6.0 0.35,6.0 0,6.7" fill="#1E1B18"/>
      </g>
      <path d="M -3.2,9.8 Q 0,11.2 3.2,9.8" fill="none" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- 左手垂在腹侧 -->
    <ellipse cx="-8.5" cy="8.5" rx="1.8" ry="2.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95" transform="rotate(15 -8.5 8.5)"/>

    <!-- 右爪抬起挠刘海 -->
    <g id="paw-scratch">
      <path d="M 6,-1 C 7.5,-4 7.5,-7 4,-9 C 2.5,-8 3.5,-5 4.5,-2 Z" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95" stroke-linejoin="round"/>
      <circle cx="3.5" cy="-8.5" r="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.95"/>
    </g>

    <!-- 思考问号气泡 -->
    <g id="bubble-q">
      <ellipse cx="6" cy="-21" rx="4.5" ry="3.5" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.85"/>
      <path d="M 3.8,-18.2 L 2,-16.5 L 4.5,-17.5 Z" fill="#FFFFFF" stroke="#1E1B18" stroke-width="0.75"/>
      <text x="6" y="-19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4.2" font-weight="bold" fill="#0284C7" text-anchor="middle">?</text>
    </g>
  </g>
</svg>
