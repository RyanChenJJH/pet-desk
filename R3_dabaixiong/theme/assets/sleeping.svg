<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
    <radialGradient id="bubble-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="40%" stop-color="rgba(186,230,253,0.65)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.75)"/>
    </radialGradient>
  </defs>
  <style>
    #shadow-js {
      animation: sleep-shadow 3.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-js {
      animation: sleep-breathe 3.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #snot-bubble {
      animation: bubble-blow 3.8s ease-in-out infinite;
      transform-origin: 1.5px 0.5px;
    }
    #bubble-pop-droplets {
      animation: bubble-pop 3.8s ease-in-out infinite;
      transform-origin: 1.5px 0.5px;
    }
    #zzz-text {
      animation: zzz-float 3.8s ease-in-out infinite;
      transform-origin: 9px -16px;
    }
    @keyframes sleep-breathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.05, 0.94) translateY(1.2px); }
    }
    @keyframes sleep-shadow {
      0%, 100% { transform: scale(1, 1); opacity: 0.12; }
      50% { transform: scale(1.08, 1.08); opacity: 0.15; }
    }
    @keyframes bubble-blow {
      0% { opacity: 0; transform: scale(0); }
      15% { opacity: 1; transform: scale(0.35); }
      45% { opacity: 1; transform: scale(0.75); }
      75% { opacity: 1; transform: scale(1.15) rotate(5deg); }
      83% { opacity: 1; transform: scale(1.35) rotate(-3deg); }
      85%, 100% { opacity: 0; transform: scale(1.45); }
    }
    @keyframes bubble-pop {
      0%, 84% { opacity: 0; transform: scale(0.5); }
      85% { opacity: 1; transform: scale(1); }
      89% { opacity: 0.8; transform: scale(1.6); }
      93%, 100% { opacity: 0; transform: scale(2.0); }
    }
    @keyframes zzz-float {
      0%, 100% { opacity: 0; transform: translate(0, 4px) scale(0.7); }
      20% { opacity: 0.9; transform: translate(1px, 0px) scale(0.9); }
      60% { opacity: 0.8; transform: translate(3px, -6px) scale(1.1); }
      85% { opacity: 0; transform: translate(4px, -11px) scale(1.2); }
    }
  </style>

  <g id="shadow-js">
    <!-- 瘫坐较宽大柔影 -->
    <ellipse cx="0" cy="18" rx="13.5" ry="2.5" fill="#000000"/>
  </g>

  <!-- 软糯方糖棉花糖瘫坐体形 (重心下沉，宽扁可爱) -->
  <g id="body-js">
    <!-- 双脚瘫放在左右两旁 -->
    <g id="feet">
      <ellipse cx="-8.5" cy="16.8" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <ellipse cx="8.5" cy="16.8" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <!-- 瘫坐方糖软糯躯干 -->
    <g id="torso">
      <path id="body-shape" d="
        M -13.5,16
        C -15.0,12 -13.5,2 -12.5,-6
        C -12.0,-11 -11.0,-14.5 -8.0,-15.8
        C -4.8,-16.5 4.8,-16.5 8.0,-15.8
        C 11.0,-14.5 12.0,-11 12.5,-6
        C 13.5,2 15.0,12 13.5,16
        C 9.0,18.0 -9.0,18.0 -13.5,16 Z"
        fill="url(#fur-grad)" stroke="#262422" stroke-width="1.05" stroke-linejoin="round"/>
    </g>

    <!-- 浅天蓝背带 (受腹部隆起展开) -->
    <g id="straps">
      <path d="M -13.2,11 C -12.8,2 -10.8,-8 -8.5,-13.2 L -6.5,-12.8 C -8.8,-8 -10.8,2 -11.0,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
      <path d="M 13.2,11 C 12.8,2 10.8,-8 8.5,-13.2 L 6.5,-12.8 C 8.8,-8 10.8,2 11.0,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
    </g>

    <!-- 头顶尖耳与呆毛 (软塌微耷拉) -->
    <g id="ears-and-spikes">
      <path d="M -9.5,-13.5 C -12.5,-14.8 -11.5,-16.5 -7.5,-15.5" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <path d="M 9.5,-13.5 C 12.5,-14.8 11.5,-16.5 7.5,-15.5" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <path d="M -3.0,-16.0 Q -4.0,-17.8 -2.5,-17.2" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 1.5,-16.2 Q 2.2,-18.0 3.0,-16.8" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- 额前 3 绺刘海 (安详垂落) -->
    <g id="forehead-bangs">
      <path d="M -4.8,-13.0 C -3.8,-10.0 -2.5,-8.5 -3.6,-5.8" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -1.2,-13.2 C -1.0,-10.5 -0.8,-8.8 -1.2,-6.0" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 2.5,-13.8 C 3.8,-10.5 3.5,-8.0 2.0,-5.0" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -4.5,-10.5 Q -3.8,-9.5 -4.2,-8.8" fill="none" stroke="#262422" stroke-width="0.7" stroke-linecap="round"/>
      <path d="M 3.0,-10.0 Q 3.5,-9.0 3.2,-8.2" fill="none" stroke="#262422" stroke-width="0.7" stroke-linecap="round"/>
    </g>

    <!-- 安详笑眯闭眼弧线 (︶  ︶) -->
    <g id="eyes-closed">
      <path d="M -7.8,-1.2 Q -6.5,0.4 -5.2,-1.2" fill="none" stroke="#262422" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 5.2,-0.8 Q 6.5,0.8 7.8,-0.8" fill="none" stroke="#262422" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <g id="face-features">
      <line x1="-9.8" y1="-0.8" x2="-14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="-9.8" y1="1.4" x2="-14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="-0.8" x2="14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="1.4" x2="14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>

      <path d="M -1.3,-1.2 L 1.3,-1.2 Q 0,0.5 -1.3,-1.2 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.8" stroke-linejoin="round"/>
      <line x1="0" y1="0.3" x2="0" y2="1.5" stroke="#262422" stroke-width="0.8"/>

      <!-- 熟睡微微微张的小粉嘴与标志性黑三角图腾 -->
      <path d="M -1.4,2.5 L 0,1.5 L 1.4,2.5 Q 0,3.0 -1.4,2.5 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.75" stroke-linejoin="round"/>
      <polygon points="-2.0,1.6 -1.4,2.4 -2.2,2.6" fill="#262422"/>
      <polygon points="2.0,1.6 1.4,2.4 2.2,2.6" fill="#262422"/>
      <polygon points="-0.3,3.1 0.3,3.1 0,3.7" fill="#262422"/>

      <path d="M -3.2,9.6 Q 0,10.5 3.2,9.6" fill="none" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 熟睡搭在肚皮两旁的小白手 -->
    <g id="arms">
      <ellipse cx="-8.2" cy="11.5" rx="2.5" ry="1.6" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <ellipse cx="8.2" cy="11.5" rx="2.5" ry="1.6" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <!-- 吹起鼻涕泡 -->
    <g id="snot-bubble">
      <ellipse cx="1.6" cy="0.4" rx="3.5" ry="3.5" fill="url(#bubble-grad)" stroke="#38BDF8" stroke-width="0.65"/>
      <!-- 高光 -->
      <circle cx="0.6" cy="-0.6" r="0.8" fill="rgba(255,255,255,0.95)"/>
    </g>

    <!-- 鼻涕泡吹爆飞溅小水珠 -->
    <g id="bubble-pop-droplets">
      <circle cx="3.2" cy="-2.5" r="0.5" fill="#38BDF8"/>
      <circle cx="4.5" cy="1.2" r="0.4" fill="#38BDF8"/>
      <circle cx="-1.5" cy="-2.2" r="0.45" fill="#38BDF8"/>
      <circle cx="2.5" cy="3.2" r="0.4" fill="#38BDF8"/>
    </g>

    <!-- 飘荡的 Zzz -->
    <g id="zzz-text">
      <text x="6" y="-18" font-family="'Comic Sans MS', sans-serif" font-size="2.6" font-weight="bold" fill="#60A5FA">Z</text>
      <text x="8.5" y="-21" font-family="'Comic Sans MS', sans-serif" font-size="3.2" font-weight="bold" fill="#3B82F6">z</text>
      <text x="11.5" y="-24.5" font-family="'Comic Sans MS', sans-serif" font-size="4.0" font-weight="bold" fill="#2563EB">z</text>
    </g>
  </g>
</svg>
