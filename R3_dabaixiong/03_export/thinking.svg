<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-js {
      animation: think-shadow 3.6s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-js {
      animation: think-tilt 3.6s ease-in-out infinite;
      transform-origin: 0px 16px;
    }
    #arm-scratch {
      animation: paw-scratch 3.6s ease-in-out infinite;
      transform-origin: 9px 5px;
    }
    #eyes-cross {
      animation: eyes-crosseyed 3.6s ease-in-out infinite;
      transform-origin: 0px -1.5px;
    }
    #mouth-skew {
      animation: mouth-pout 3.6s ease-in-out infinite;
      transform-origin: 0px 2.5px;
    }
    #question-mark {
      animation: qmark-pop 3.6s ease-in-out infinite;
      transform-origin: 7px -20px;
    }
    #smoke-steam {
      animation: cpu-smoke 3.6s ease-in-out infinite;
      transform-origin: 0px -18px;
    }
    @keyframes think-tilt {
      0%, 100% { transform: rotate(0deg); }
      20%, 55% { transform: rotate(4deg) translateY(-0.5px); }
      65%, 90% { transform: rotate(-2deg) translateY(0.2px); }
    }
    @keyframes think-shadow {
      0%, 100% { transform: scale(1, 1); opacity: 0.11; }
      50% { transform: scale(0.96, 0.96); opacity: 0.13; }
    }
    @keyframes paw-scratch {
      0%, 15%, 85%, 100% { transform: rotate(0deg) translate(0, 0); }
      22%, 30%, 38%, 46% { transform: rotate(-65deg) translate(-2px, -8px); }
      26%, 34%, 42%, 50% { transform: rotate(-55deg) translate(-2px, -9.5px); }
      55%, 80% { transform: rotate(-30deg) translate(0px, -4px); }
    }
    @keyframes eyes-crosseyed {
      0%, 15%, 85%, 100% { transform: translate(0, 0); }
      25%, 75% { transform: scale(1.1) translate(0, 0); }
    }
    #eye-left-cross {
      animation: eye-left-shift 3.6s ease-in-out infinite;
    }
    #eye-right-cross {
      animation: eye-right-shift 3.6s ease-in-out infinite;
    }
    @keyframes eye-left-shift {
      0%, 15%, 85%, 100% { transform: translate(0, 0); }
      25%, 75% { transform: translate(3.8px, 0.4px); }
    }
    @keyframes eye-right-shift {
      0%, 15%, 85%, 100% { transform: translate(0, 0); }
      25%, 75% { transform: translate(-3.8px, 0.4px); }
    }
    @keyframes mouth-pout {
      0%, 15%, 85%, 100% { transform: rotate(0deg) scale(1); }
      25%, 75% { transform: rotate(-8deg) translate(1px, -0.5px) scale(0.85); }
    }
    @keyframes qmark-pop {
      0%, 10% { opacity: 0; transform: scale(0) translateY(4px); }
      20%, 45% { opacity: 1; transform: scale(1) translateY(0); }
      48% { opacity: 1; transform: scale(1.3) translateY(-2px); }
      52%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes cpu-smoke {
      0%, 50% { opacity: 0; transform: scale(0) translateY(0); }
      55% { opacity: 0.9; transform: scale(0.6) translateY(-2px); }
      75% { opacity: 0.7; transform: scale(1.1) translateY(-6px); }
      90%, 100% { opacity: 0; transform: scale(1.3) translateY(-10px); }
    }
  </style>

  <g id="shadow-js">
    <ellipse cx="0" cy="18" rx="11.5" ry="2.2" fill="#000000"/>
  </g>

  <g id="body-js">
    <g id="feet">
      <ellipse id="foot-left" cx="-5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <ellipse id="foot-right" cx="5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <g id="torso">
      <path id="body-shape" d="
        M -11.5,16
        C -13.0,14 -12.5,4 -12.2,-5
        C -12.0,-11 -11.2,-15.2 -8.5,-16.8
        C -5.0,-17.5 5.0,-17.5 8.5,-16.8
        C 11.2,-15.2 12.0,-11 12.2,-5
        C 12.5,4 13.0,14 11.5,16
        C 7.5,17.8 -7.5,17.8 -11.5,16 Z"
        fill="url(#fur-grad)" stroke="#262422" stroke-width="1.05" stroke-linejoin="round"/>
    </g>

    <g id="straps">
      <path d="M -11.8,11 C -11.8,2 -10.2,-10 -8.5,-14.2 L -6.5,-13.5 C -8.2,-9.5 -9.8,2 -9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
      <path d="M 11.8,11 C 11.8,2 10.2,-10 8.5,-14.2 L 6.5,-13.5 C 8.2,-9.5 9.8,2 9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
    </g>

    <g id="ears-and-spikes">
      <path d="M -10.5,-14.5 C -13.6,-16.8 -12.5,-18.5 -8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="-12.2" y1="-16.0" x2="-13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 10.5,-14.5 C 13.6,-16.8 12.5,-18.5 8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="12.2" y1="-16.0" x2="13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -3.5,-17.2 Q -4.8,-19.5 -3.0,-19.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.2,-17.5 Q -1.5,-20.0 0,-18.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 1.8,-17.5 Q 2.5,-19.8 3.5,-18.2" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="forehead-bangs">
      <path d="M -5.2,-14.2 C -4.2,-10.8 -2.8,-9.0 -4.0,-6.0" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -1.5,-14.5 C -1.2,-11.5 -1.0,-9.5 -1.5,-6.5" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 2.8,-15.0 C 4.2,-11.2 3.8,-8.5 2.2,-5.2" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -5.0,-11.5 Q -4.2,-10.2 -4.8,-9.5" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
      <path d="M 3.2,-10.8 Q 3.8,-9.6 3.4,-8.8" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
    </g>

    <!-- 斗鸡眼动画组 -->
    <g id="eyes-cross">
      <circle id="eye-left-cross" cx="-6.5" cy="-1.8" r="0.75" fill="#262422"/>
      <circle id="eye-right-cross" cx="6.5" cy="-1.3" r="0.75" fill="#262422"/>
    </g>

    <g id="face-features">
      <line x1="-9.8" y1="-0.8" x2="-14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="-9.8" y1="1.4" x2="-14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="-0.8" x2="14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="1.4" x2="14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>

      <path d="M -1.3,-1.2 L 1.3,-1.2 Q 0,0.5 -1.3,-1.2 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.8" stroke-linejoin="round"/>
      <line x1="0" y1="0.3" x2="0" y2="1.5" stroke="#262422" stroke-width="0.8"/>

      <g id="mouth-skew">
        <path d="M -1.6,2.6 L 0,1.4 L 1.6,2.6 Q 0,3.2 -1.6,2.6 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.75" stroke-linejoin="round"/>
        <polygon points="-2.2,1.5 -1.5,2.5 -2.4,2.7" fill="#262422"/>
        <polygon points="2.2,1.5 1.5,2.5 2.4,2.7" fill="#262422"/>
        <polygon points="-0.3,3.3 0.3,3.3 0,3.9" fill="#262422"/>
      </g>

      <path d="M -3.2,9.6 Q 0,10.5 3.2,9.6" fill="none" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 左手臂垂放 -->
    <path d="M -10.5,7.5 Q -13.0,10.5 -11.5,13.5 Q -9.5,14.0 -9.0,11.2" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>

    <!-- 右手臂挠头动画 -->
    <g id="arm-scratch">
      <path d="M 10.5,7.5 Q 13.0,10.5 11.5,13.5 Q 9.5,14.0 9.0,11.2" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <!-- 问号气泡 -->
    <g id="question-mark">
      <ellipse cx="8" cy="-21" rx="4" ry="3.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.8"/>
      <path d="M 6.5,-22.2 C 6.5,-23.5 9.5,-23.5 9.5,-22.0 C 9.5,-21.0 8.0,-20.5 8.0,-19.5" fill="none" stroke="#3B82F6" stroke-width="1.0" stroke-linecap="round"/>
      <circle cx="8" cy="-18.2" r="0.4" fill="#3B82F6"/>
    </g>

    <!-- CPU 干烧冒烟蒸汽 -->
    <g id="smoke-steam">
      <path d="M -2,-19 C -4,-21.5 -1,-23 -3,-25" fill="none" stroke="rgba(156,163,175,0.85)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 2,-19 C 0,-22 3,-23.5 1.5,-25.5" fill="none" stroke="rgba(156,163,175,0.85)" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
