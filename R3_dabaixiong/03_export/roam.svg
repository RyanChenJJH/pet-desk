<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body-grad-roam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FDFAF7"/>
      <stop offset="100%" stop-color="#ECE7E1"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-roam {
      animation: shadow-waddle 0.9s ease-in-out infinite alternate;
      transform-origin: 2px 18px;
    }
    #bear-body-roam {
      animation: waddle-body 0.9s ease-in-out infinite alternate;
      transform-origin: 0px 18px;
    }
    #leg-left {
      animation: step-feet-l 0.9s ease-in-out infinite;
      transform-origin: -4px 15px;
    }
    #leg-right {
      animation: step-feet-r 0.9s ease-in-out infinite;
      transform-origin: 5px 15px;
    }
    #arm-swing-left {
      animation: arm-swing-l 0.9s ease-in-out infinite;
      transform-origin: -7px 9px;
    }
    #arm-swing-right {
      animation: arm-swing-r 0.9s ease-in-out infinite;
      transform-origin: 7px 9px;
    }
    #tuft-bob {
      animation: tuft-bounce 0.45s ease-in-out infinite alternate;
      transform-origin: 3px -21px;
    }
    @keyframes waddle-body {
      0% { transform: rotate(-4.5deg) translateY(-0.8px); }
      100% { transform: rotate(4.5deg) translateY(0.8px); }
    }
    @keyframes shadow-waddle {
      0% { transform: scale(0.95, 1) translateX(-1px); }
      100% { transform: scale(1.05, 1) translateX(1px); }
    }
    @keyframes step-feet-l {
      0%, 100% { transform: rotate(15deg) translateY(-1.5px); }
      50% { transform: rotate(-15deg) translateY(0.5px); }
    }
    @keyframes step-feet-r {
      0%, 100% { transform: rotate(-15deg) translateY(0.5px); }
      50% { transform: rotate(15deg) translateY(-1.5px); }
    }
    @keyframes arm-swing-l {
      0%, 100% { transform: rotate(-22deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes arm-swing-r {
      0%, 100% { transform: rotate(22deg); }
      50% { transform: rotate(-22deg); }
    }
    @keyframes tuft-bounce {
      0% { transform: rotate(-6deg) translateY(0); }
      100% { transform: rotate(6deg) translateY(-0.8px); }
    }
  </style>

  <g id="shadow-roam">
    <ellipse cx="2" cy="18" rx="12.5" ry="2.6" fill="rgba(0,0,0,0.12)"/>
  </g>

  <g id="bear-body-roam">
    <g id="leg-left">
      <ellipse cx="-4" cy="17" rx="3.2" ry="1.8" fill="#ECE7E1" stroke="#2B2523" stroke-width="1.0"/>
    </g>
    <g id="arm-swing-left">
      <path d="M -7,9 Q -11,13 -9,16 Q -6,17 -6,13" fill="#ECE7E1" stroke="#2B2523" stroke-width="1.0"/>
    </g>

    <path d="
      M -10,16 
      C -14,14 -12,-4 -10,-12
      C -8,-18 2,-20 6,-18
      C 12,-16 16,-9 16,-2
      C 16,6 15,13 11,16
      C 6,18.5 -6,18.5 -10,16 Z"
      fill="url(#body-grad-roam)" stroke="#2B2523" stroke-width="1.2" stroke-linejoin="round"/>

    <path d="M -10,13.5 C -10,16 2,18 10,16 C 14,15 15,12 11,11 C 3,11 -7,10 -10,13.5 Z" fill="#93C5FD" stroke="#2B2523" stroke-width="1.0"/>
    <path d="M -4,5 L 2,12 L 4,12 L 0,5 Z" fill="#93C5FD" stroke="#2B2523" stroke-width="0.9"/>
    <circle cx="2" cy="11.5" r="0.75" fill="#2563EB"/>

    <g id="ears-roam">
      <path d="M -6,-18 C -7,-22 -2,-22 -2,-17 Z" fill="#ECE7E1" stroke="#2B2523" stroke-width="1.0"/>
      <path d="M 6,-18 C 6,-23 12,-22 10,-16 Z" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.2"/>
    </g>

    <g id="tuft-bob">
      <path d="M 2,-19 Q 3,-23 5,-23 Q 4,-21 3.5,-19" fill="none" stroke="#2B2523" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <g id="face-roam">
      <circle cx="8" cy="-2.5" r="0.9" fill="#1C1917"/>
      <line x1="12" y1="-1" x2="16.5" y2="-1.2" stroke="#2B2523" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="12" y1="1.5" x2="16" y2="2" stroke="#2B2523" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M 12,-0.5 L 14.5,-0.2 Q 13,1.2 12,-0.5 Z" fill="#F49DAE" stroke="#2B2523" stroke-width="0.8"/>
      <path d="M 11.5,4 Q 13.5,3.2 13.5,5" fill="none" stroke="#2B2523" stroke-width="0.8"/>
      <path d="M 6,9 Q 9,10.5 12,9" fill="none" stroke="#2B2523" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="leg-right">
      <ellipse cx="5" cy="17.5" rx="3.5" ry="2" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.1"/>
    </g>
    <g id="arm-swing-right">
      <path d="M 7,9 Q 11,13 9,16 Q 6,17 6,13" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.1"/>
    </g>
  </g>
</svg>
