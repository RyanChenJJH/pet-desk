<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FDFAF7"/>
      <stop offset="100%" stop-color="#ECE7E1"/>
    </linearGradient>
    <linearGradient id="star-cookie-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-jump {
      animation: shadow-contract 1.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-notify {
      animation: shock-bounce 1.8s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #cookie-hands {
      animation: hold-cookie-cheer 1.8s ease-in-out infinite;
      transform-origin: 0px -10px;
    }
    #sparkle-1 {
      animation: star-twinkle 1.2s ease-in-out infinite;
    }
    #sparkle-2 {
      animation: star-twinkle 1.2s ease-in-out 0.6s infinite;
    }
    @keyframes shock-bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      15% { transform: translateY(-5.5px) scale(0.96, 1.05); }
      30% { transform: translateY(0.5px) scale(1.08, 0.92); }
      45%, 85% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes shadow-contract {
      0%, 100% { transform: scale(1, 1); opacity: 0.12; }
      15% { transform: scale(0.65, 0.65); opacity: 0.05; }
      30% { transform: scale(1.15, 1.15); opacity: 0.16; }
      45%, 85% { transform: scale(1, 1); opacity: 0.12; }
    }
    @keyframes hold-cookie-cheer {
      0%, 35%, 100% { transform: translateY(12px) scale(0); opacity: 0; }
      42% { transform: translateY(0) scale(1.1); opacity: 1; }
      48%, 85% { transform: translateY(0) rotate(6deg) scale(1); opacity: 1; }
      65% { transform: translateY(0) rotate(-6deg) scale(1); opacity: 1; }
      92% { transform: translateY(6px) scale(0.4); opacity: 0; }
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <g id="shadow-jump">
    <ellipse cx="0" cy="18" rx="13" ry="2.8" fill="rgba(0,0,0,0.12)"/>
  </g>

  <g id="body-notify">
    <g id="feet">
      <ellipse cx="-6" cy="17.5" rx="3.5" ry="2" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.1"/>
      <ellipse cx="6" cy="17.5" rx="3.5" ry="2" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.1"/>
    </g>
    <path d="M -12,16 C -16,15 -14,-4 -12,-12 C -11,-17 -6,-20 0,-20 C 6,-20 11,-17 12,-12 C 14,-4 16,15 12,16 C 8,18.5 -8,18.5 -12,16 Z" fill="url(#body-grad)" stroke="#2B2523" stroke-width="1.2" stroke-linejoin="round"/>
    
    <g id="overalls">
      <path d="M -12.5,13.5 C -13,16 -7,18 0,18 C 7,18 13,16 12.5,13.5 C 12,10 9,10 0,10 C -9,10 -12,10 -12.5,13.5 Z" fill="#93C5FD" stroke="#2B2523" stroke-width="1.0"/>
      <path d="M -9,4 L -7,11 L -5,11 L -7,4 Z" fill="#93C5FD" stroke="#2B2523" stroke-width="0.9"/>
      <circle cx="-6" cy="10.5" r="0.75" fill="#2563EB"/>
      <path d="M 9,4 L 7,11 L 5,11 L 7,4 Z" fill="#93C5FD" stroke="#2B2523" stroke-width="0.9"/>
      <circle cx="6" cy="10.5" r="0.75" fill="#2563EB"/>
    </g>

    <!-- 惊吓立直炸毛双耳 -->
    <g id="ears-alert">
      <path d="M -13,-18 C -15,-23 -9,-24 -7,-18 Z" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.2"/>
      <path d="M 13,-18 C 15,-23 9,-24 7,-18 Z" fill="#FDFAF7" stroke="#2B2523" stroke-width="1.2"/>
    </g>

    <!-- 瞪大的眼睛 -->
    <circle cx="-7.5" cy="-3" r="1.3" fill="#1C1917"/>
    <circle cx="-7.8" cy="-3.3" r="0.4" fill="#FFFFFF"/>
    <circle cx="7.5" cy="-3" r="1.3" fill="#1C1917"/>
    <circle cx="7.2" cy="-3.3" r="0.4" fill="#FFFFFF"/>

    <!-- 惊呼大张的“O”形嘴巴 -->
    <g id="face-notify">
      <path d="M -1.8,-0.5 L 1.8,-0.5 Q 0,1.8 -1.8,-0.5 Z" fill="#F49DAE" stroke="#2B2523" stroke-width="0.9"/>
      <ellipse cx="0" cy="5.2" rx="2.5" ry="3.2" fill="#D97284" stroke="#2B2523" stroke-width="0.9"/>
      <path d="M -3.5,10.5 Q 0,12 3.5,10.5" fill="none" stroke="#2B2523" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- 双手高举的大号金黄星星曲奇饼干道具 -->
    <g id="cookie-hands">
      <path d="M -11,8 Q -10,-2 -4,-7" fill="none" stroke="#FDFAF7" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 11,8 Q 10,-2 4,-7" fill="none" stroke="#FDFAF7" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="-4" cy="-7.5" rx="1.5" ry="1.5" fill="#FDFAF7" stroke="#2B2523" stroke-width="0.8"/>
      <circle cx="4" cy="-7.5" rx="1.5" ry="1.5" fill="#FDFAF7" stroke="#2B2523" stroke-width="0.8"/>

      <g id="star-cookie" transform="translate(0, -11) scale(1.1)">
        <polygon points="0,-6 1.8,-1.8 6.2,-1.5 2.8,1.4 3.9,5.8 0,3.4 -3.9,5.8 -2.8,1.4 -6.2,-1.5 -1.8,-1.8" fill="url(#star-cookie-grad)" stroke="#D97706" stroke-width="0.8" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="0.5" fill="#B45309"/>
        <circle cx="-1.5" cy="-0.8" r="0.4" fill="#B45309"/>
        <circle cx="1.5" cy="0.8" r="0.4" fill="#B45309"/>
      </g>
    </g>

    <!-- 闪耀小星星 -->
    <g id="sparkle-1" transform="translate(-13, -15)">
      <polygon points="0,-2 0.6,-0.6 2,0 0.6,0.6 0,2 -0.6,0.6 -2,0 -0.6,-0.6" fill="#FBBF24"/>
    </g>
    <g id="sparkle-2" transform="translate(13, -15)">
      <polygon points="0,-2 0.6,-0.6 2,0 0.6,0.6 0,2 -0.6,0.6 -2,0 -0.6,-0.6" fill="#FBBF24"/>
    </g>
  </g>
</svg>
