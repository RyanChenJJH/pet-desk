<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-js {
      animation: notif-shadow 2.6s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-js {
      animation: notif-bounce 2.6s ease-in-out infinite;
      transform-origin: 0px 16px;
    }
    #star-trophy {
      animation: star-present 2.6s ease-in-out infinite;
      transform-origin: 0px 0px;
    }
    #ears-and-spikes {
      animation: notif-ears 2.6s ease-in-out infinite;
      transform-origin: 0px -15px;
    }
    #mouth-surprise {
      animation: notif-mouth 2.6s ease-in-out infinite;
      transform-origin: 0px 2.5px;
    }
    @keyframes notif-bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      12% { transform: translateY(1.5px) scale(1.08, 0.92); }
      22% { transform: translateY(-4.5px) scale(0.94, 1.06); }
      32% { transform: translateY(-3.5px) scale(1.0, 1.0); }
      40% { transform: translateY(0.5px) scale(1.04, 0.96); }
      46% { transform: translateY(-0.8px); }
      52%, 92% { transform: translateY(0); }
    }
    @keyframes notif-shadow {
      0%, 100% { transform: scale(1, 1); opacity: 0.12; }
      12% { transform: scale(1.15, 1.15); opacity: 0.15; }
      22% { transform: scale(0.65, 0.65); opacity: 0.05; }
      32% { transform: scale(0.75, 0.75); opacity: 0.07; }
      40% { transform: scale(1.08, 1.08); opacity: 0.14; }
      52%, 92% { transform: scale(1, 1); opacity: 0.12; }
    }
    @keyframes notif-ears {
      0%, 100% { transform: scale(1); }
      15%, 35% { transform: scale(1.18) rotate(3deg); }
      25% { transform: scale(1.22) rotate(-3deg); }
      45%, 90% { transform: scale(1); }
    }
    @keyframes notif-mouth {
      0%, 100% { transform: scale(1); }
      18%, 45% { transform: scale(1.4, 1.6) translateY(0.4px); }
      50%, 90% { transform: scale(1.1, 1.1); }
    }
    @keyframes star-present {
      0%, 15%, 100% { opacity: 0; transform: scale(0) translateY(10px) rotate(-30deg); }
      28% { opacity: 1; transform: scale(1.15) translateY(-14px) rotate(10deg); }
      36% { transform: scale(1) translateY(-12px) rotate(-8deg); }
      44%, 78% { opacity: 1; transform: scale(1.05) translateY(-13px) rotate(6deg); }
      52%, 86% { opacity: 1; transform: scale(1.02) translateY(-12.5px) rotate(-4deg); }
      92% { opacity: 0; transform: scale(0.2) translateY(5px); }
    }
  </style>

  <g id="shadow-js">
    <ellipse cx="0" cy="18" rx="11.5" ry="2.2" fill="#000000"/>
  </g>

  <g id="body-js">
    <g id="feet">
      <ellipse id="foot-left" cx="-5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <ellipse id="foot-right" cx="5.2" cy="17.2" rx="3.0" ry="1.5" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <g id="torso">
      <path id="body-shape" d="
        M -11.5,16
        C -13.0,14 -12.5,4 -12.2,-5
        C -12.0,-11 -11.2,-15.2 -8.5,-16.8
        C -5.0,-17.5 5.0,-17.5 8.5,-16.8
        C 11.2,-15.2 12.0,-11 12.2,-5
        C 12.5,4 13.0,14 11.5,16
        C 7.5,17.8 -7.5,17.8 -11.5,16 Z"
        fill="url(#fur-grad)" stroke="#262422" stroke-width="1.05" stroke-linejoin="round"/>
    </g>

    <g id="straps">
      <path d="M -11.8,11 C -11.8,2 -10.2,-10 -8.5,-14.2 L -6.5,-13.5 C -8.2,-9.5 -9.8,2 -9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
      <path d="M 11.8,11 C 11.8,2 10.2,-10 8.5,-14.2 L 6.5,-13.5 C 8.2,-9.5 9.8,2 9.8,11 Z" fill="#98BEDE" stroke="#262422" stroke-width="0.8"/>
    </g>

    <g id="ears-and-spikes">
      <path d="M -10.5,-14.5 C -13.6,-16.8 -12.5,-18.5 -8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="-12.2" y1="-16.0" x2="-13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 10.5,-14.5 C 13.6,-16.8 12.5,-18.5 8.2,-16.8" fill="none" stroke="#262422" stroke-width="1.05" stroke-linecap="round"/>
      <line x1="12.2" y1="-16.0" x2="13.8" y2="-15.5" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -3.5,-17.2 Q -4.8,-19.5 -3.0,-19.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -1.2,-17.5 Q -1.5,-20.0 0,-18.0" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 1.8,-17.5 Q 2.5,-19.8 3.5,-18.2" fill="none" stroke="#262422" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="forehead-bangs">
      <path d="M -5.2,-14.2 C -4.2,-10.8 -2.8,-9.0 -4.0,-6.0" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -1.5,-14.5 C -1.2,-11.5 -1.0,-9.5 -1.5,-6.5" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 2.8,-15.0 C 4.2,-11.2 3.8,-8.5 2.2,-5.2" fill="none" stroke="#262422" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -5.0,-11.5 Q -4.2,-10.2 -4.8,-9.5" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
      <path d="M 3.2,-10.8 Q 3.8,-9.6 3.4,-8.8" fill="none" stroke="#262422" stroke-width="0.75" stroke-linecap="round"/>
    </g>

    <g id="eyes">
      <circle cx="-6.5" cy="-1.8" r="0.85" fill="#262422"/>
      <circle cx="6.5" cy="-1.3" r="0.85" fill="#262422"/>
    </g>

    <g id="face-features">
      <line x1="-9.8" y1="-0.8" x2="-14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="-9.8" y1="1.4" x2="-14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="-0.8" x2="14.5" y2="-0.8" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="9.8" y1="1.4" x2="14.0" y2="2.0" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>

      <path d="M -1.3,-1.2 L 1.3,-1.2 Q 0,0.5 -1.3,-1.2 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.8" stroke-linejoin="round"/>
      <line x1="0" y1="0.3" x2="0" y2="1.5" stroke="#262422" stroke-width="0.8"/>

      <g id="mouth-surprise">
        <path d="M -1.6,2.6 L 0,1.4 L 1.6,2.6 Q 0,3.2 -1.6,2.6 Z" fill="#E9B4BE" stroke="#262422" stroke-width="0.75" stroke-linejoin="round"/>
        <polygon points="-2.2,1.5 -1.5,2.5 -2.4,2.7" fill="#262422"/>
        <polygon points="2.2,1.5 1.5,2.5 2.4,2.7" fill="#262422"/>
        <polygon points="-0.3,3.3 0.3,3.3 0,3.9" fill="#262422"/>
      </g>

      <path d="M -3.2,9.6 Q 0,10.5 3.2,9.6" fill="none" stroke="#262422" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- 双爪高举 -->
    <g id="arms">
      <path d="M -10,7.5 Q -14,5 -12,2 Q -9.5,4 -8.5,8" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
      <path d="M 10,7.5 Q 14,5 12,2 Q 9.5,4 8.5,8" fill="#FFFFFF" stroke="#262422" stroke-width="0.95"/>
    </g>

    <!-- 发光大星星饼干 (变出并高举摇晃) -->
    <g id="star-trophy">
      <!-- 闪耀金色外光晕 -->
      <polygon points="0,-18 3.5,-11 11,-10 5.5,-5 7.5,2 0,-2 -7.5,2 -5.5,-5 -11,-10 -3.5,-11"
        fill="rgba(254, 240, 138, 0.55)" stroke="#F59E0B" stroke-width="0.8" stroke-linejoin="round"/>
      <polygon points="0,-17 3.0,-11.5 9.5,-10.8 4.8,-6.5 6.5,-0.5 0,-4 -6.5,-0.5 -4.8,-6.5 -9.5,-10.8 -3.0,-11.5"
        fill="url(#star-grad)" stroke="#B45309" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- 星星可爱笑脸点缀 -->
      <circle cx="-1.8" cy="-9.5" r="0.45" fill="#78350F"/>
      <circle cx="1.8" cy="-9.5" r="0.45" fill="#78350F"/>
      <path d="M -1.0,-7.8 Q 0,-6.8 1.0,-7.8" fill="none" stroke="#78350F" stroke-width="0.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
