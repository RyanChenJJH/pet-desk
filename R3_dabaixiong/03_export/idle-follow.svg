<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#EFF2F5"/>
    </linearGradient>
  </defs>
  <style>
    #shadow-js {
      animation: shadow-breathe 3.2s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #body-js {
      animation: jelly-breathe 3.2s ease-in-out infinite;
      transform-origin: 0px 18px;
    }
    #ears-and-spikes {
      animation: ear-twitch 3.8s ease-in-out infinite;
      transform-origin: 0px -18px;
    }
    #forehead-bangs {
      animation: bangs-sway 3.2s ease-in-out infinite;
      transform-origin: 0px -16px;
    }
    #eyes-js {
      animation: eye-blink 4.2s steps(1) infinite;
      transform-origin: 0px -1px;
    }
    @keyframes jelly-breathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.025, 0.975) translateY(0.35px); }
    }
    @keyframes shadow-breathe {
      0%, 100% { transform: scale(1, 1); opacity: 0.11; }
      50% { transform: scale(1.05, 1.05); opacity: 0.14; }
    }
    @keyframes ear-twitch {
      0%, 82%, 100% { transform: rotate(0deg); }
      85% { transform: rotate(-3deg) scaleY(1.05); }
      88% { transform: rotate(3deg) scaleY(0.97); }
      91% { transform: rotate(-2deg); }
    }
    @keyframes bangs-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes eye-blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96%, 98% { transform: scaleY(0.1); }
    }
  </style>

  <g id="shadow-js">
    <ellipse cx="0" cy="18" rx="11.5" ry="2.2" fill="#000000"/>
  </g>

  <g id="body-js">
    <g id="feet">
      <ellipse id="foot-left" cx="-5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
      <ellipse id="foot-right" cx="5.5" cy="17.5" rx="3.2" ry="1.6" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.0"/>
    </g>

    <g id="torso">
      <path id="body-shape" d="
        M -11,16
        C -13,15 -12,2 -11.5,-6
        C -11.2,-13 -10.5,-18 -7,-20
        C -3,-21 3,-21 7,-20
        C 10.5,-18 11.2,-13 11.5,-6
        C 12,2 13,15 11,16
        C 7,18 -7,18 -11,16 Z"
        fill="url(#fur-grad)" stroke="#1E1B18" stroke-width="1.15" stroke-linejoin="round"/>
    </g>

    <g id="straps">
      <path d="M -11,10 C -11,1 -9.5,-12 -8,-16 L -6,-15 C -7.5,-11 -9,1 -9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
      <path d="M 11,10 C 11,1 9.5,-12 8,-16 L 6,-15 C 7.5,-11 9,1 9,10 Z" fill="#95BEE6" stroke="#1E1B18" stroke-width="0.85"/>
    </g>

    <g id="ears-and-spikes">
      <path d="M -10,-17 C -13,-20 -11,-22 -7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="-11.2" y1="-17.5" x2="-12.8" y2="-17.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M 10,-17 C 13,-20 11,-22 7.5,-20" fill="none" stroke="#1E1B18" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="11.2" y1="-17.5" x2="12.8" y2="-17.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <path d="M -3,-20.5 Q -4,-23 -2.5,-22.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -1,-21 Q 0,-23.5 1,-21" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 2.5,-20.5 Q 4,-23 4.5,-21" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
    </g>

    <g id="forehead-bangs">
      <path d="M -6.5,-16 C -5.5,-12 -3.5,-10 -5,-7" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M -2.5,-16 C -2,-13 -1.5,-11 -2,-7.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <path d="M 3.5,-17 C 5,-13 4.5,-10 3,-6.5" fill="none" stroke="#1E1B18" stroke-width="0.95" stroke-linecap="round"/>
      <line x1="-5.2" y1="-13.5" x2="-5" y2="-12" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="4.2" y1="-13" x2="4.5" y2="-11.5" stroke="#1E1B18" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <g id="eyes-js">
      <circle id="eye-left" cx="-7.5" cy="-1" r="0.75" fill="#1E1B18"/>
      <circle id="eye-right" cx="7.5" cy="-1" r="0.75" fill="#1E1B18"/>
    </g>

    <g id="face-features">
      <line x1="-10.5" y1="1" x2="-16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="-10.5" y1="3.2" x2="-15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="1" x2="16" y2="1.2" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
      <line x1="10.5" y1="3.2" x2="15.5" y2="3.8" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>

      <path d="M -1.5,0.2 L 1.5,0.2 Q 0,2.0 -1.5,0.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.85" stroke-linejoin="round"/>
      <line x1="0" y1="1.8" x2="0" y2="3.8" stroke="#1E1B18" stroke-width="0.85"/>

      <path d="M -1.8,5.2 L 0,3.8 L 1.8,5.2 Q 0,5.8 -1.8,5.2 Z" fill="#F4A3B4" stroke="#1E1B18" stroke-width="0.75" stroke-linejoin="round"/>
      <polygon points="-2.6,3.6 -1.8,5.0 -2.9,5.2" fill="#1E1B18"/>
      <polygon points="2.6,3.6 1.8,5.0 2.9,5.2" fill="#1E1B18"/>
      <polygon points="-0.35,6.0 0.35,6.0 0,6.7" fill="#1E1B18"/>

      <path d="M -3.2,9.8 Q 0,11.2 3.2,9.8" fill="none" stroke="#1E1B18" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <g id="arms">
      <g id="arm-left">
        <path d="M -10,8 Q -13,11 -11.5,14.5 Q -9,15 -8.5,12" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.05"/>
      </g>
      <g id="arm-right">
        <path d="M 10,8 Q 13,11 11.5,14.5 Q 9,15 8.5,12" fill="#FFFFFF" stroke="#1E1B18" stroke-width="1.05"/>
      </g>
    </g>
  </g>
</svg>
