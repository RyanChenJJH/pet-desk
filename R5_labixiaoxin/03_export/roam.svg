<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 1. 身体上下颠簸与轻微前倾摇摆 (1.0s 步频周期) */
    @keyframes roam-body-bob {
      0%, 100% {
        transform: translateY(0px) rotate(1.5deg);
      }
      25% {
        transform: translateY(-1.2px) rotate(-1deg);
      }
      50% {
        transform: translateY(0px) rotate(1.5deg);
      }
      75% {
        transform: translateY(-1.2px) rotate(-1deg);
      }
    }

    /* 2. 地面投影颠簸缩放 */
    @keyframes roam-shadow {
      0%, 50%, 100% {
        transform: scale(1, 1);
        opacity: 0.14;
      }
      25%, 75% {
        transform: scale(0.92, 0.92);
        opacity: 0.10;
      }
    }

    /* 3. 左腿前后摆动 */
    @keyframes roam-leg-left {
      0%, 100% {
        transform: rotate(-15deg);
      }
      50% {
        transform: rotate(15deg);
      }
    }

    /* 4. 右腿反向交替前后摆动 */
    @keyframes roam-leg-right {
      0%, 100% {
        transform: rotate(15deg);
      }
      50% {
        transform: rotate(-15deg);
      }
    }

    /* 5. 左手甩臂 */
    @keyframes roam-arm-left {
      0%, 100% {
        transform: rotate(20deg);
      }
      50% {
        transform: rotate(-20deg);
      }
    }

    /* 6. 右手甩臂 */
    @keyframes roam-arm-right {
      0%, 100% {
        transform: rotate(-20deg);
      }
      50% {
        transform: rotate(20deg);
      }
    }

    /* 7. 粗眉欢快上下跳跃 */
    @keyframes roam-brow-bob {
      0%, 50%, 100% {
        transform: translateY(0px);
      }
      25%, 75% {
        transform: translateY(-0.8px);
      }
    }

    #shadow-js {
      animation: roam-shadow 1.0s ease-in-out infinite;
    }
    #body-js {
      animation: roam-body-bob 1.0s ease-in-out infinite;
    }
    #leg-left {
      animation: roam-leg-left 1.0s ease-in-out infinite;
    }
    #leg-right {
      animation: roam-leg-right 1.0s ease-in-out infinite;
    }
    #arm-left {
      animation: roam-arm-left 1.0s ease-in-out infinite;
    }
    #arm-right {
      animation: roam-arm-right 1.0s ease-in-out infinite;
    }
    #eyebrows {
      animation: roam-brow-bob 1.0s ease-in-out infinite;
    }
  </style>

  <!-- 地面投影 -->
  <g id="shadow-js" style="transform-origin: 0px 16.5px">
    <ellipse cx="0" cy="16.5" rx="9.5" ry="2.2" fill="#000000"/>
  </g>

  <!-- 角色主体驱动层 (整体面向右侧巡逻) -->
  <g id="body-js" style="transform-origin: 0px 15px">
    <!-- 足部与小蓝鞋 -->
    <g id="legs">
      <!-- 左腿 (后腿) -->
      <g id="leg-left" style="transform-origin: -4px 9.5px">
        <rect x="-6" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="-3.5" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
        <path d="M -6 15.2 Q -3.5 14.2 -1 15.2" stroke="#FFFFFF" stroke-width="0.6" fill="none" opacity="0.8"/>
      </g>
      <!-- 右腿 (前腿) -->
      <g id="leg-right" style="transform-origin: 4px 9.5px">
        <rect x="2" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="4.5" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
        <path d="M 2 15.2 Q 4.5 14.2 7 15.2" stroke="#FFFFFF" stroke-width="0.6" fill="none" opacity="0.8"/>
      </g>
    </g>

    <!-- 躯干与服饰 -->
    <g id="torso">
      <!-- 黄色短裤 -->
      <path id="shorts" d="M -7.5 8 L 7.5 8 L 6.5 12.8 L 1 12.8 L 0 9.8 L -1 12.8 L -6.5 12.8 Z" fill="#FACC15" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/>
      <!-- 红色 T 恤 -->
      <path id="shirt" d="M -8 1 C -8.5 4.5 -7.8 8.5 -7 8.5 L 7 8.5 C 7.8 8.5 8.5 4.5 8 1 C 8 -1.5 -8 -1.5 -8 1 Z" fill="#EF4444" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M -3 0.8 Q 0 2.6 3 0.8" stroke="#DC2626" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 双臂 (甩手大步走) -->
    <g id="arms">
      <!-- 左臂 -->
      <g id="arm-left" style="transform-origin: -7px 2px">
        <path d="M -7.5 1.5 L -10 3.5 L -8.5 6 L -6.5 4.5 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M -9 4.5 Q -12 7.5 -8.5 9.8" stroke="#FED7AA" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="-8.5" cy="10" r="1.3" fill="#FED7AA" stroke="#1F2937" stroke-width="0.6"/>
      </g>
      <!-- 右臂 -->
      <g id="arm-right" style="transform-origin: 7px 2px">
        <path d="M 7.5 1.5 L 10 3.5 L 8.5 6 L 6.5 4.5 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M 9 4.5 Q 12 7.5 9.5 9.8" stroke="#FED7AA" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="9.5" cy="10" r="1.3" fill="#FED7AA" stroke="#1F2937" stroke-width="0.6"/>
      </g>
    </g>

    <!-- 头部组件 (面朝右前视) -->
    <g id="head" style="transform-origin: 0px 1px">
      <!-- 短平头短发 -->
      <path id="hair" d="M -10.5 -6 C -10.5 -15 8 -15 10.5 -6 C 11 -2.5 9.8 0.5 8 1.5 C 5 2.5 -7 2.5 -10.5 -6 Z" fill="#1E293B"/>
      
      <!-- 经典凸脸颊与脸蛋轮廓 (凸起在右侧前进方向) -->
      <path id="face" d="M -8.5 -6.5 C -9.5 -2.5 -9 1 -7 4.5 C -5 6 0 6.2 4 5.8 C 7.5 5.5 10 4.2 12.2 1.5 C 13.5 -0.8 12.8 -4 10.5 -5.8 C 8.5 -7.2 0 -7.8 -8.5 -6.5 Z" fill="#FED7AA" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
      
      <!-- 耳朵 -->
      <g id="ear-left">
        <ellipse cx="-9.2" cy="-1.8" rx="1.6" ry="2.1" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M -9.3 -2.8 Q -8.4 -1.8 -9.3 -0.8" stroke="#FDBA74" stroke-width="0.6" fill="none"/>
      </g>
      <g id="ear-right">
        <ellipse cx="11.2" cy="-1.8" rx="1.4" ry="1.8" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
      </g>

      <!-- 腮红 -->
      <ellipse id="blush-left" cx="-5.5" cy="1.2" rx="2" ry="1.2" fill="#FB7185" opacity="0.6"/>
      <ellipse id="blush-right" cx="7.2" cy="1.2" rx="2.2" ry="1.3" fill="#FB7185" opacity="0.6"/>

      <!-- 嘴巴 (得意小微笑) -->
      <path id="mouth" d="M -0.5 3 Q 2 4.6 4.5 2.8" stroke="#1F2937" stroke-width="1.0" fill="none" stroke-linecap="round"/>

      <!-- 标志性波浪粗眉 -->
      <g id="eyebrows" style="transform-origin: 0px -7px">
        <path id="brow-left" d="M -7.5 -7.5 C -5.5 -11 -3 -8 -1.8 -7" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path id="brow-right" d="M 2 -7 C 3.5 -8 6.2 -11 8.5 -7.2" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      </g>

      <!-- 眼睛 (朝右前方看) -->
      <g id="eyes" style="transform-origin: 0px -2.5px">
        <g id="eye-left">
          <ellipse cx="-3.5" cy="-2.5" rx="2.5" ry="3.0" fill="#0F172A"/>
          <circle cx="-3.0" cy="-3.6" r="1.0" fill="#FFFFFF"/>
          <circle cx="-2.6" cy="-1.6" r="0.45" fill="#FFFFFF"/>
        </g>
        <g id="eye-right">
          <ellipse cx="5.5" cy="-2.5" rx="2.5" ry="3.0" fill="#0F172A"/>
          <circle cx="6.0" cy="-3.6" r="1.0" fill="#FFFFFF"/>
          <circle cx="6.4" cy="-1.6" r="0.45" fill="#FFFFFF"/>
        </g>
      </g>
    </g>
  </g>
</svg>
