<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 1. 动感光波发射后座力与兴奋跳跃 (0.7s) */
    @keyframes beam-body-hop {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      30% {
        transform: translateY(-2px) scale(0.98, 1.04);
      }
      70% {
        transform: translateY(0.5px) scale(1.02, 0.98);
      }
    }

    /* 2. 地面投影伴随跳跃同步起伏 */
    @keyframes beam-shadow {
      0%, 100% {
        transform: scale(1, 1);
        opacity: 0.14;
      }
      30% {
        transform: scale(0.85, 0.85);
        opacity: 0.08;
      }
      70% {
        transform: scale(1.08, 1.05);
        opacity: 0.16;
      }
    }

    /* 3. 双臂动感光波蓄力震颤 */
    @keyframes beam-arms-vibrate {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-0.8px) rotate(2deg);
      }
      75% {
        transform: translateY(0.8px) rotate(-2deg);
      }
    }

    /* 4. 动感光波弧线能量环喷射 (0.7s 严格闭环) */
    @keyframes beam-ring-pulse {
      0% {
        transform: translate(11px, 6px) scale(0.4);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translate(22px, 6px) scale(1.8);
        opacity: 0;
      }
    }

    /* 5. 动感闪耀星光闪烁 */
    @keyframes beam-star-twinkle {
      0%, 100% {
        transform: scale(0.8) rotate(0deg);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.3) rotate(90deg);
        opacity: 1;
      }
    }

    #body-js {
      animation: beam-body-hop 0.7s ease-in-out infinite;
    }
    #shadow-js {
      animation: beam-shadow 0.7s ease-in-out infinite;
    }
    #arms-beam {
      animation: beam-arms-vibrate 0.35s ease-in-out infinite;
    }
    #beam-waves {
      animation: beam-ring-pulse 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    #star-1, #star-2 {
      animation: beam-star-twinkle 0.7s ease-in-out infinite;
    }
  </style>

  <!-- 地面投影 -->
  <g id="shadow-js" style="transform-origin: 0px 16.5px">
    <ellipse cx="0" cy="16.5" rx="9.5" ry="2.2" fill="#000000"/>
  </g>

  <!-- 角色主体驱动层 -->
  <g id="body-js" style="transform-origin: 0px 15px">
    <!-- 足部与小蓝鞋 -->
    <g id="legs">
      <!-- 欢快张开小步 -->
      <g id="leg-left">
        <rect x="-7" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="-5" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
      </g>
      <g id="leg-right">
        <rect x="3" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="5" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
      </g>
    </g>

    <!-- 躯干与服饰 -->
    <g id="torso">
      <path id="shorts" d="M -8 8 L 8 8 L 7 12.8 L 1 12.8 L 0 9.8 L -1 12.8 L -7 12.8 Z" fill="#FACC15" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/>
      <path id="shirt" d="M -8.5 1 C -9 4.5 -8 8.5 -7.5 8.5 L 7.5 8.5 C 8 8.5 9 4.5 8.5 1 C 8.5 -1.5 -8.5 -1.5 -8.5 1 Z" fill="#EF4444" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
    </g>

    <!-- 头部组件 (大笑兴奋) -->
    <g id="head" style="transform-origin: 0px 1px">
      <path id="hair" d="M -10.5 -6 C -10.5 -15 8 -15 10.5 -6 C 11 -2.5 9.8 0.5 8 1.5 C 5 2.5 -7 2.5 -10.5 -6 Z" fill="#1E293B"/>
      <path id="face" d="M -8.5 -6.5 C -9.5 -2.5 -9 1 -7 4.5 C -5 6 0 6.2 4 5.8 C 7.5 5.5 10 4.2 12.2 1.5 C 13.5 -0.8 12.8 -4 10.5 -5.8 C 8.5 -7.2 0 -7.8 -8.5 -6.5 Z" fill="#FED7AA" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
      
      <ellipse cx="-9.2" cy="-1.8" rx="1.6" ry="2.1" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
      <ellipse cx="11.2" cy="-1.8" rx="1.4" ry="1.8" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>

      <ellipse id="blush-left" cx="-5.5" cy="1.2" rx="2.2" ry="1.4" fill="#FB7185" opacity="0.75"/>
      <ellipse id="blush-right" cx="7.2" cy="1.2" rx="2.4" ry="1.5" fill="#FB7185" opacity="0.75"/>

      <!-- 兴奋大张嘴大笑 (露出小粉舌) -->
      <path id="mouth" d="M -1 2.5 Q 2 8 5 2.5 Z" fill="#BE123C" stroke="#1F2937" stroke-width="1.0"/>
      <path d="M 0 5.2 Q 2 4.2 4 5.2" stroke="#FDA4AF" stroke-width="1.2" fill="none"/>

      <!-- 高高飞扬的欢快粗眉 -->
      <g id="eyebrows" style="transform-origin: 0px -7px">
        <path id="brow-left" d="M -8 -8.5 C -6 -12.5 -3.5 -9.5 -2 -8.5" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path id="brow-right" d="M 2 -8.5 C 3.5 -9.5 6 -12.5 8 -8.5" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      </g>

      <!-- 晶亮大眼睛 -->
      <g id="eyes">
        <g id="eye-left">
          <ellipse cx="-4.5" cy="-2.5" rx="2.5" ry="3.0" fill="#0F172A"/>
          <circle cx="-5.3" cy="-3.6" r="1.1" fill="#FFFFFF"/>
          <circle cx="-3.9" cy="-1.6" r="0.5" fill="#FFFFFF"/>
        </g>
        <g id="eye-right">
          <ellipse cx="4.5" cy="-2.5" rx="2.5" ry="3.0" fill="#0F172A"/>
          <circle cx="3.7" cy="-3.6" r="1.1" fill="#FFFFFF"/>
          <circle cx="5.1" cy="-1.6" r="0.5" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- 经典动感光波姿势 (双臂向前右方平行射出) -->
    <g id="arms-beam" style="transform-origin: 2px 5px">
      <!-- 左臂向前伸出 -->
      <g id="arm-left">
        <path d="M -7.5 1.5 L -9 4 L -7 6 L -5 4 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M -6 4 Q 0 4 8 5" stroke="#FED7AA" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="8" cy="5" r="1.5" fill="#FED7AA" stroke="#1F2937" stroke-width="0.7"/>
      </g>
      <!-- 右臂向前伸出并拢 -->
      <g id="arm-right">
        <path d="M 7 1.5 L 9 3.5 L 7.5 6 L 5.5 4 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M 6.5 4 Q 8 4.5 10 5" stroke="#FED7AA" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="10" cy="5" r="1.5" fill="#FED7AA" stroke="#1F2937" stroke-width="0.7"/>
      </g>
    </g>

    <!-- 动感光波发射特效 (能量环与闪亮光波) -->
    <g id="beam-waves" style="transform-origin: 10px 5px">
      <!-- 同心能量弧环 (动感光波哔哔哔) -->
      <ellipse cx="0" cy="0" rx="3.5" ry="5" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
      <ellipse cx="2" cy="0" rx="4.5" ry="6.5" fill="none" stroke="#FACC15" stroke-width="1.0"/>
    </g>

    <!-- 闪烁星芒 (动感超人星星) -->
    <g id="star-1" style="transform-origin: 16px -4px">
      <polygon points="16,-7 17,-4.5 19.5,-4 17,-3.5 16,-1 15,-3.5 12.5,-4 15,-4.5" fill="#FDE047"/>
    </g>
    <g id="star-2" style="transform-origin: 18px 12px">
      <polygon points="18,10 18.8,11.8 20.5,12 18.8,12.5 18,14 17.2,12.5 15.5,12 17.2,11.8" fill="#38BDF8"/>
    </g>
  </g>
</svg>
