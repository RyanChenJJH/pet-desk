<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 1. 专注点头与身体微起伏 (0.8s) */
    @keyframes work-nod {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-0.8px) rotate(1deg);
      }
    }

    /* 2. 左手快速敲击键盘 (0.24s 高频交替) */
    @keyframes type-arm-left {
      0%, 100% {
        transform: rotate(12deg) translateY(0px);
      }
      50% {
        transform: rotate(-4deg) translateY(-1.2px);
      }
    }

    /* 3. 右手快速敲击键盘 */
    @keyframes type-arm-right {
      0%, 100% {
        transform: rotate(-4deg) translateY(-1.2px);
      }
      50% {
        transform: rotate(12deg) translateY(0px);
      }
    }

    /* 4. 笔记本屏幕荧光微脉冲 */
    @keyframes laptop-screen-glow {
      0%, 100% {
        fill: #38BDF8;
        opacity: 0.85;
      }
      50% {
        fill: #818CF8;
        opacity: 1;
      }
    }

    /* 5. 粗眉专注轻颤 */
    @keyframes work-brow-focus {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(0.5px);
      }
    }

    #body-js {
      animation: work-nod 0.8s ease-in-out infinite;
    }
    #arm-left {
      animation: type-arm-left 0.24s ease-in-out infinite;
    }
    #arm-right {
      animation: type-arm-right 0.24s ease-in-out infinite;
    }
    #laptop-screen {
      animation: laptop-screen-glow 1.2s ease-in-out infinite;
    }
    #eyebrows {
      animation: work-brow-focus 0.8s ease-in-out infinite;
    }
  </style>

  <!-- 地面投影 -->
  <g id="shadow-js" style="transform-origin: 0px 16.5px">
    <ellipse cx="0" cy="16.5" rx="10" ry="2.2" fill="rgba(0,0,0,0.14)"/>
  </g>

  <!-- 角色主体驱动层 -->
  <g id="body-js" style="transform-origin: 0px 15px">
    <!-- 足部与小蓝鞋 -->
    <g id="legs">
      <!-- 坐姿/微屈立姿 -->
      <g id="leg-left">
        <rect x="-6" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="-4" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
      </g>
      <g id="leg-right">
        <rect x="2" y="9.5" width="4" height="5.5" rx="2" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
        <ellipse cx="4" cy="15.2" rx="3.2" ry="1.7" fill="#38BDF8" stroke="#1F2937" stroke-width="0.9"/>
      </g>
    </g>

    <!-- 躯干与服饰 -->
    <g id="torso">
      <path id="shorts" d="M -7.5 8 L 7.5 8 L 6.5 12.8 L 1 12.8 L 0 9.8 L -1 12.8 L -6.5 12.8 Z" fill="#FACC15" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/>
      <path id="shirt" d="M -8 1 C -8.5 4.5 -7.8 8.5 -7 8.5 L 7 8.5 C 7.8 8.5 8.5 4.5 8 1 C 8 -1.5 -8 -1.5 -8 1 Z" fill="#EF4444" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
    </g>

    <!-- 头部组件 (前倾专注) -->
    <g id="head" style="transform-origin: 0px 1px">
      <path id="hair" d="M -10.5 -6 C -10.5 -15 8 -15 10.5 -6 C 11 -2.5 9.8 0.5 8 1.5 C 5 2.5 -7 2.5 -10.5 -6 Z" fill="#1E293B"/>
      <path id="face" d="M -8.5 -6.5 C -9.5 -2.5 -9 1 -7 4.5 C -5 6 0 6.2 4 5.8 C 7.5 5.5 10 4.2 12.2 1.5 C 13.5 -0.8 12.8 -4 10.5 -5.8 C 8.5 -7.2 0 -7.8 -8.5 -6.5 Z" fill="#FED7AA" stroke="#1F2937" stroke-width="1.1" stroke-linejoin="round"/>
      
      <ellipse cx="-9.2" cy="-1.8" rx="1.6" ry="2.1" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>
      <ellipse cx="11.2" cy="-1.8" rx="1.4" ry="1.8" fill="#FED7AA" stroke="#1F2937" stroke-width="0.8"/>

      <ellipse id="blush-left" cx="-5.5" cy="1.2" rx="2" ry="1.2" fill="#FB7185" opacity="0.6"/>
      <ellipse id="blush-right" cx="7.2" cy="1.2" rx="2.2" ry="1.3" fill="#FB7185" opacity="0.6"/>

      <!-- 专注认真闭口/小嘴 -->
      <line x1="-0.5" y1="3.5" x2="3.5" y2="3.5" stroke="#1F2937" stroke-width="1.0" stroke-linecap="round"/>

      <!-- 粗眉微平/认真 -->
      <g id="eyebrows" style="transform-origin: 0px -7px">
        <path id="brow-left" d="M -7.5 -6.5 C -5.5 -9 -3 -7 -2 -6.2" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path id="brow-right" d="M 2 -6.2 C 3.2 -7 6 -9 8 -6.5" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      </g>

      <!-- 眼睛向下注视电脑屏幕 -->
      <g id="eyes">
        <g id="eye-left">
          <ellipse cx="-4.5" cy="-1.8" rx="2.4" ry="2.6" fill="#0F172A"/>
          <circle cx="-5" cy="-2.5" r="0.8" fill="#FFFFFF"/>
        </g>
        <g id="eye-right">
          <ellipse cx="4.5" cy="-1.8" rx="2.4" ry="2.6" fill="#0F172A"/>
          <circle cx="4" cy="-2.5" r="0.8" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- 前方工作台与超迷你笔电 -->
    <g id="laptop-rig">
      <!-- 笔记本底座/键盘区 -->
      <polygon points="-6.5,12 6.5,12 8,15 -8,15" fill="#475569" stroke="#1F2937" stroke-width="0.8"/>
      <!-- 键盘按键网格线 -->
      <line x1="-5.5" y1="13.2" x2="5.5" y2="13.2" stroke="#94A3B8" stroke-width="0.6"/>
      <line x1="-6.2" y1="14.2" x2="6.2" y2="14.2" stroke="#94A3B8" stroke-width="0.6"/>
      <!-- 笔记本掀开的屏幕 -->
      <polygon points="-6,6 6,6 6.5,12 -6.5,12" fill="#1E293B" stroke="#1F2937" stroke-width="0.8"/>
      <rect id="laptop-screen" x="-5.2" y="7" width="10.4" height="4.2" rx="0.5" fill="#38BDF8"/>
      <!-- 屏幕里的迷你代码行 -->
      <line x1="-4" y1="8.2" x2="2" y2="8.2" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round"/>
      <line x1="-4" y1="9.5" x2="4" y2="9.5" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round"/>
    </g>

    <!-- 双臂飞速打字 (覆盖在笔记本键盘上方) -->
    <g id="arms">
      <!-- 左手 -->
      <g id="arm-left" style="transform-origin: -7px 3px">
        <path d="M -7.5 2 L -9.5 4.5 L -7.5 7 L -5.5 5.5 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M -7 5.5 Q -6 9.5 -3.5 12" stroke="#FED7AA" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="-3.2" cy="12.2" r="1.3" fill="#FED7AA" stroke="#1F2937" stroke-width="0.6"/>
      </g>
      <!-- 右手 -->
      <g id="arm-right" style="transform-origin: 7px 3px">
        <path d="M 7.5 2 L 9.5 4.5 L 7.5 7 L 5.5 5.5 Z" fill="#DC2626" stroke="#1F2937" stroke-width="0.8"/>
        <path d="M 7 5.5 Q 6 9.5 3.5 12" stroke="#FED7AA" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="3.2" cy="12.2" r="1.3" fill="#FED7AA" stroke="#1F2937" stroke-width="0.6"/>
      </g>
    </g>
  </g>
</svg>
