<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clock-case-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAD285"/>
      <stop offset="35%" stop-color="#E29D42"/>
      <stop offset="100%" stop-color="#B87326"/>
    </linearGradient>
    <radialGradient id="bell-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <style>
      @keyframes body-think {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-0.3px) rotate(-1.5deg); }
        65% { transform: translateY(0.4px) rotate(1.2deg); }
      }
      @keyframes shadow-think {
        0%, 100% { transform: scale(1); opacity: 0.15; }
        30% { transform: scale(0.97, 1.02); opacity: 0.13; }
        65% { transform: scale(1.03, 0.98); opacity: 0.17; }
      }
      @keyframes hand-reverse-minute {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-35deg); }
        50% { transform: rotate(-10deg); }
        75% { transform: rotate(-45deg); }
      }
      @keyframes hand-reverse-hour {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-12deg); }
        70% { transform: rotate(-4deg); }
      }
      @keyframes arm-ponder {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-4deg) translateY(-0.4px); }
      }
      @keyframes arm-rest {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3deg); }
      }
      @keyframes eyes-think {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        30% { transform: translate(0.6px, -0.6px) scale(0.98); }
        60% { transform: translate(-0.3px, -0.2px) scale(1.02); }
        88%, 94% { transform: translate(0px, 0px) scaleY(0.12); }
      }
      @keyframes bubble-float {
        0% {
          opacity: 0;
          transform: translateY(0);
        }
        20% {
          opacity: 0.75;
        }
        50% {
          opacity: 0.9;
          transform: translateY(-4px);
        }
        80% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
          transform: translateY(-8px);
        }
      }
      @keyframes gear-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes key-think {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        70% { transform: rotate(6deg); }
      }
      @keyframes hammer-think {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2.5deg); }
      }

      #body-js { animation: body-think 3.2s ease-in-out infinite; transform-origin: 5px 18px; }
      #shadow-js { animation: shadow-think 3.2s ease-in-out infinite; transform-origin: 5px 18px; }
      #windup-key { animation: key-think 3.2s ease-in-out infinite; transform-origin: -7px 2px; }
      #minute-hand { animation: hand-reverse-minute 2.4s ease-in-out infinite; transform-origin: 5px 2px; }
      #hour-hand { animation: hand-reverse-hour 2.4s ease-in-out infinite; transform-origin: 5px 2px; }
      #arm-left { animation: arm-rest 3.2s ease-in-out infinite; transform-origin: -7px 3px; }
      #arm-right { animation: arm-ponder 2.4s ease-in-out infinite; transform-origin: 17px 3px; }
      #eyes-js { animation: eyes-think 3.2s ease-in-out infinite; transform-origin: 5px 2px; }
      #alarm-hammer { animation: hammer-think 3.2s ease-in-out infinite; transform-origin: 5px -5px; }
      #thought-bubble { animation: bubble-float 3.2s ease-in-out infinite; transform-origin: 14.5px -15px; }
      #bubble-gear { animation: gear-spin 2.4s linear infinite; transform-origin: 12.2px -15px; }
    </style>
  </defs>

  <!-- 1. Shadow layer (#shadow-js) -->
  <g id="shadow-js" style="transform-origin: 5px 18px">
    <ellipse cx="5" cy="18" rx="9.5" ry="2.2" fill="rgba(0,0,0,0.15)"/>
  </g>

  <!-- 2. Windup key layer (#windup-key) -->
  <g id="windup-key" style="transform-origin: -7px 2px">
    <path d="M -7 2 L -11 2" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-12" cy="2" r="2.2" fill="none" stroke="#4B5563" stroke-width="1.2"/>
  </g>

  <!-- 3. Mechanical body & chassis (#body-js) -->
  <g id="body-js">
    <!-- 3.1 Mechanical feet (#feet) -->
    <g id="feet">
      <g id="leg-left" style="transform-origin: 1px 13px">
        <line x1="1" y1="13" x2="0" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="0" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
      <g id="leg-right" style="transform-origin: 9px 13px">
        <line x1="9" y1="13" x2="10" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="10" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.2 Clock shell (#clock-shell) -->
    <g id="clock-shell">
      <circle cx="5" cy="2" r="12" fill="url(#clock-case-grad)" stroke="#1F2937" stroke-width="1.2"/>
      <!-- Bottom brackets -->
      <polygon points=" -4,11 -6,14 -3,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
      <polygon points=" 14,11 16,14 13,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
    </g>

    <!-- 3.3 Dial & ticks (#dial-group) -->
    <g id="dial-group">
      <circle cx="5" cy="2" r="9.2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <circle cx="5" cy="-6" r="0.6" fill="#64748B"/>
      <circle cx="13" cy="2" r="0.6" fill="#64748B"/>
      <circle cx="5" cy="10" r="0.6" fill="#64748B"/>
      <circle cx="-3" cy="2" r="0.6" fill="#64748B"/>
    </g>

    <!-- 3.4 Clock hands (#clock-hands) -->
    <g id="clock-hands">
      <line id="hour-hand" x1="5" y1="2" x2="5" y2="-2.5" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round" style="transform-origin: 5px 2px"/>
      <line id="minute-hand" x1="5" y1="2" x2="9" y2="2" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round" style="transform-origin: 5px 2px"/>
      <circle cx="5" cy="2" r="1.1" fill="#EF4444" stroke="#1F2937" stroke-width="0.6"/>
    </g>

    <!-- 3.5 Contemplative eyes looking up-right (#eyes-js) -->
    <g id="eyes-js" style="transform-origin: 5px 2px">
      <!-- Left eye -->
      <g id="eye-left">
        <ellipse cx="2.6" cy="0.0" rx="2.1" ry="2.7" fill="#0F172A"/>
        <circle cx="2.2" cy="-1.0" r="0.8" fill="#FFFFFF"/>
        <path d="M 0.6 -1.2 Q 2.6 -2.4 4.4 -1.4" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Right eye with arched eyebrow -->
      <g id="eye-right">
        <ellipse cx="8.6" cy="0.0" rx="2.1" ry="2.7" fill="#0F172A"/>
        <circle cx="8.2" cy="-1.0" r="0.8" fill="#FFFFFF"/>
        <path d="M 6.8 -1.8 Q 8.8 -2.6 10.6 -1.4" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- 3.6 Twin bells & hammer (#bell-rig) -->
    <g id="bell-rig">
      <g id="bell-left" style="transform-origin: -3px -7px">
        <path d="M -7 -6 C -7 -11 -1 -11 -1 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <g id="bell-right" style="transform-origin: 13px -7px">
        <path d="M 11 -6 C 11 -11 17 -11 17 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <g id="alarm-hammer" style="transform-origin: 5px -5px">
        <line x1="5" y1="-5" x2="5" y2="-9.5" stroke="#4B5563" stroke-width="1.2"/>
        <circle cx="5" cy="-9.5" r="1.2" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.7 Contemplative arms: Left arm resting, Right arm pondering on cheek (#arms) -->
    <g id="arms">
      <!-- Left arm: natural resting position -->
      <g id="arm-left" style="transform-origin: -7px 3px">
        <path d="M -7 3 Q -10 5 -9 9" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="-9" cy="9.5" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
      <!-- Right arm: bent upward holding cheek/chin in thought -->
      <g id="arm-right" style="transform-origin: 17px 3px">
        <path d="M 17 3 Q 20.5 8.5 16 9.5 Q 14 9 13.5 8" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="13.5" cy="7.2" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
    </g>

    <!-- 3.8 Floating thought bubble with rotating gear and question mark (#thought-bubble) -->
    <g id="thought-bubble" style="transform-origin: 14.5px -15px">
      <!-- Trail bubbles -->
      <circle cx="8.5" cy="-10.2" r="0.7" fill="rgba(248, 250, 252, 0.88)" stroke="#64748B" stroke-width="0.5"/>
      <circle cx="10.2" cy="-12.2" r="1.1" fill="rgba(248, 250, 252, 0.88)" stroke="#64748B" stroke-width="0.5"/>

      <!-- Main thought bubble capsule -->
      <rect x="8.5" y="-18.5" width="12" height="7" rx="3.5" fill="rgba(248, 250, 252, 0.92)" stroke="#64748B" stroke-width="0.6"/>

      <!-- Miniature rotating gear inside thought bubble (#bubble-gear) -->
      <g id="bubble-gear" style="transform-origin: 12.2px -15px">
        <circle cx="12.2" cy="-15" r="1.8" fill="#F59E0B" stroke="#B45309" stroke-width="0.3"/>
        <rect x="11.7" y="-17.2" width="1.0" height="4.4" rx="0.2" fill="#F59E0B"/>
        <rect x="10.0" y="-15.5" width="4.4" height="1.0" rx="0.2" fill="#F59E0B"/>
        <rect x="11.7" y="-17.2" width="1.0" height="4.4" rx="0.2" fill="#F59E0B" transform="rotate(45 12.2 -15)"/>
        <rect x="11.7" y="-17.2" width="1.0" height="4.4" rx="0.2" fill="#F59E0B" transform="rotate(-45 12.2 -15)"/>
        <circle cx="12.2" cy="-15" r="0.75" fill="#F8FAFC" stroke="#B45309" stroke-width="0.3"/>
      </g>

      <!-- Question mark beside gear (#bubble-question) -->
      <g id="bubble-question">
        <path d="M 15.6 -16.4 C 15.6 -17.4 17.4 -17.4 17.4 -16.3 C 17.4 -15.5 16.5 -15.2 16.5 -14.4" stroke="#475569" stroke-width="0.75" stroke-linecap="round" fill="none"/>
        <circle cx="16.5" cy="-13.3" r="0.4" fill="#475569"/>
      </g>
    </g>
  </g>
</svg>
