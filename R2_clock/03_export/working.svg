<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clock-case-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAD285"/>
      <stop offset="35%" stop-color="#E29D42"/>
      <stop offset="100%" stop-color="#B87326"/>
    </linearGradient>
    <radialGradient id="bell-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <style>
      @keyframes dial-spin-minute {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dial-spin-hour {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes arm-type-left {
        0%, 100% { transform: rotate(-6deg) translateY(-0.8px); }
        50% { transform: rotate(8deg) translateY(1.2px); }
      }
      @keyframes arm-type-right {
        0%, 100% { transform: rotate(8deg) translateY(1.2px); }
        50% { transform: rotate(-6deg) translateY(-0.8px); }
      }
      @keyframes body-overclock-vibe {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-0.2px, 0.2px); }
        50% { transform: translate(0.15px, -0.15px); }
        75% { transform: translate(-0.15px, -0.1px); }
      }
      @keyframes shadow-overclock {
        0%, 100% { transform: scale(1); opacity: 0.16; }
        50% { transform: scale(1.02, 0.98); opacity: 0.18; }
      }
      @keyframes key-turn-fast {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bell-glow {
        0%, 100% {
          filter: drop-shadow(0 0 1px rgba(251, 191, 36, 0.4));
          opacity: 0.92;
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 0 3.5px rgba(245, 158, 11, 0.95));
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes hammer-vibe {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(2.5deg); }
        75% { transform: rotate(-2.5deg); }
      }
      @keyframes eyes-concentrate {
        0%, 90%, 96%, 100% { transform: translateY(0.3px) scaleY(1); }
        93% { transform: translateY(0.3px) scaleY(0.12); }
      }
      @keyframes tap-glow-left {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 0.85; transform: scale(1.1); }
      }
      @keyframes tap-glow-right {
        0%, 100% { opacity: 0.85; transform: scale(1.1); }
        50% { opacity: 0; transform: scale(0.5); }
      }

      #body-js { animation: body-overclock-vibe 0.12s ease-in-out infinite; transform-origin: 5px 18px; }
      #shadow-js { animation: shadow-overclock 0.12s ease-in-out infinite; transform-origin: 5px 18px; }
      #windup-key { animation: key-turn-fast 0.6s linear infinite; transform-origin: -7px 2px; }
      #minute-hand { animation: dial-spin-minute 0.5s linear infinite; transform-origin: 5px 2px; }
      #hour-hand { animation: dial-spin-hour 1.5s linear infinite; transform-origin: 5px 2px; }
      #arm-left { animation: arm-type-left 0.25s ease-in-out infinite; transform-origin: -7px 3px; }
      #arm-right { animation: arm-type-right 0.25s ease-in-out infinite; transform-origin: 17px 3px; }
      #bell-left { animation: bell-glow 0.6s ease-in-out infinite; transform-origin: -3px -7px; }
      #bell-right { animation: bell-glow 0.6s ease-in-out infinite; transform-origin: 13px -7px; }
      #alarm-hammer { animation: hammer-vibe 0.12s ease-in-out infinite; transform-origin: 5px -5px; }
      #eyes-js { animation: eyes-concentrate 3.0s infinite; transform-origin: 5px 2px; }
      #tap-glow-left { animation: tap-glow-left 0.25s ease-in-out infinite; transform-origin: -2px 12px; }
      #tap-glow-right { animation: tap-glow-right 0.25s ease-in-out infinite; transform-origin: 12px 12px; }
    </style>
  </defs>

  <!-- 1. Shadow layer (#shadow-js) -->
  <g id="shadow-js" style="transform-origin: 5px 18px">
    <ellipse cx="5" cy="18" rx="9.5" ry="2.2" fill="rgba(0,0,0,0.15)"/>
  </g>

  <!-- 2. Windup key layer (#windup-key) -->
  <g id="windup-key" style="transform-origin: -7px 2px">
    <path d="M -7 2 L -11 2" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-12" cy="2" r="2.2" fill="none" stroke="#4B5563" stroke-width="1.2"/>
  </g>

  <!-- 3. Mechanical body & chassis (#body-js) -->
  <g id="body-js">
    <!-- 3.1 Mechanical feet (#feet) -->
    <g id="feet">
      <g id="leg-left" style="transform-origin: 1px 13px">
        <line x1="1" y1="13" x2="0" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="0" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
      <g id="leg-right" style="transform-origin: 9px 13px">
        <line x1="9" y1="13" x2="10" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="10" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.2 Clock shell (#clock-shell) -->
    <g id="clock-shell">
      <circle cx="5" cy="2" r="12" fill="url(#clock-case-grad)" stroke="#1F2937" stroke-width="1.2"/>
      <!-- Bottom brackets -->
      <polygon points=" -4,11 -6,14 -3,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
      <polygon points=" 14,11 16,14 13,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
    </g>

    <!-- 3.3 Dial & ticks (#dial-group) -->
    <g id="dial-group">
      <circle cx="5" cy="2" r="9.2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <circle cx="5" cy="-6" r="0.6" fill="#64748B"/>
      <circle cx="13" cy="2" r="0.6" fill="#64748B"/>
      <circle cx="5" cy="10" r="0.6" fill="#64748B"/>
      <circle cx="-3" cy="2" r="0.6" fill="#64748B"/>
    </g>

    <!-- 3.4 Clock hands (#clock-hands) -->
    <g id="clock-hands">
      <line id="hour-hand" x1="5" y1="2" x2="5" y2="-2.5" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round" style="transform-origin: 5px 2px"/>
      <line id="minute-hand" x1="5" y1="2" x2="9" y2="2" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round" style="transform-origin: 5px 2px"/>
      <circle cx="5" cy="2" r="1.1" fill="#EF4444" stroke="#1F2937" stroke-width="0.6"/>
    </g>

    <!-- 3.5 Focused eyes with high concentration (#eyes-js) -->
    <g id="eyes-js" style="transform-origin: 5px 2px">
      <!-- Left eye -->
      <g id="eye-left">
        <ellipse cx="2" cy="0.8" rx="2.2" ry="2.6" fill="#0F172A"/>
        <circle cx="1.6" cy="0.2" r="0.75" fill="#FFFFFF"/>
        <path d="M 0.2 -0.8 Q 2.2 0.3 4.2 -0.6" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Right eye -->
      <g id="eye-right">
        <ellipse cx="8" cy="0.8" rx="2.2" ry="2.6" fill="#0F172A"/>
        <circle cx="7.6" cy="0.2" r="0.75" fill="#FFFFFF"/>
        <path d="M 5.8 -0.6 Q 7.8 0.3 9.8 -0.8" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- 3.6 Twin bells & hammer (#bell-rig) -->
    <g id="bell-rig">
      <g id="bell-left" style="transform-origin: -3px -7px">
        <path d="M -7 -6 C -7 -11 -1 -11 -1 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <g id="bell-right" style="transform-origin: 13px -7px">
        <path d="M 11 -6 C 11 -11 17 -11 17 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <g id="alarm-hammer" style="transform-origin: 5px -5px">
        <line x1="5" y1="-5" x2="5" y2="-9.5" stroke="#4B5563" stroke-width="1.2"/>
        <circle cx="5" cy="-9.5" r="1.2" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.7 Desktop mini keyboard -->
    <g id="keyboard">
      <path d="M -2.5 12.8 L 12.5 12.8 L 14.5 16.8 L -4.5 16.8 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.7"/>
      <!-- Top key row -->
      <rect x="-1.8" y="13.3" width="2" height="1.1" rx="0.25" fill="#38BDF8"/>
      <rect x="0.8" y="13.3" width="2" height="1.1" rx="0.25" fill="#E2E8F0"/>
      <rect x="3.4" y="13.3" width="2" height="1.1" rx="0.25" fill="#E2E8F0"/>
      <rect x="6" y="13.3" width="2" height="1.1" rx="0.25" fill="#E2E8F0"/>
      <rect x="8.6" y="13.3" width="2" height="1.1" rx="0.25" fill="#F59E0B"/>
      <!-- Bottom key row & spacebar -->
      <rect x="-3" y="14.9" width="2.4" height="1.2" rx="0.25" fill="#E2E8F0"/>
      <rect x="0" y="14.9" width="8" height="1.2" rx="0.25" fill="#38BDF8"/>
      <rect x="8.6" y="14.9" width="2.8" height="1.2" rx="0.25" fill="#10B981"/>
    </g>

    <!-- 3.8 Keystroke tap energy sparks -->
    <ellipse id="tap-glow-left" cx="-2" cy="12" rx="2.2" ry="1.4" fill="#38BDF8"/>
    <ellipse id="tap-glow-right" cx="12" cy="12" rx="2.2" ry="1.4" fill="#F59E0B"/>

    <!-- 3.9 Rapid alternating typing arms (#arms) -->
    <g id="arms">
      <g id="arm-left" style="transform-origin: -7px 3px">
        <path d="M -7 3 Q -8 8 -2 11" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="-2" cy="11.5" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
      <g id="arm-right" style="transform-origin: 17px 3px">
        <path d="M 17 3 Q 18 8 12 11" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="12" cy="11.5" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
    </g>
  </g>
</svg>