<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clock-case-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAD285"/>
      <stop offset="35%" stop-color="#E29D42"/>
      <stop offset="100%" stop-color="#B87326"/>
    </linearGradient>
    <radialGradient id="bell-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <style>
      @keyframes hammer-ring {
        0%, 100% { transform: rotate(-28deg); }
        50% { transform: rotate(28deg); }
      }
      @keyframes bell-hit-left {
        0%, 100% {
          transform: rotate(-6deg) translate(-0.5px, -0.4px) scale(1.06);
          filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.9));
        }
        50% {
          transform: rotate(0deg) translate(0, 0) scale(1);
          filter: none;
        }
      }
      @keyframes bell-hit-right {
        0%, 100% {
          transform: rotate(0deg) translate(0, 0) scale(1);
          filter: none;
        }
        50% {
          transform: rotate(6deg) translate(0.5px, -0.4px) scale(1.06);
          filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.9));
        }
      }
      @keyframes alarm-shake {
        0%, 100% { transform: translateY(-1.2px) rotate(2deg); }
        50% { transform: translateY(0px) rotate(-2deg); }
      }
      @keyframes sound-waves {
        0% { transform: scale(0.6); opacity: 0; }
        50% { transform: scale(1.0); opacity: 0.9; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes alarm-eyes {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      @keyframes arms-alarm {
        0%, 100% { transform: rotate(-14deg) translateY(-0.8px); }
        50% { transform: rotate(14deg) translateY(0.8px); }
      }
      @keyframes shadow-alarm {
        0%, 100% { transform: scale(0.88, 0.88) translateX(0.3px); opacity: 0.10; }
        50% { transform: scale(1.06, 1.04) translateX(-0.3px); opacity: 0.20; }
      }
      @keyframes led-pulse {
        0%, 100% {
          filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.4));
          fill: #EF4444;
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 0 3px rgba(239, 68, 68, 1));
          fill: #FF2222;
          opacity: 1;
          transform: scale(1.25);
        }
      }
      @keyframes hands-alarm {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(3deg); }
        75% { transform: rotate(-3deg); }
      }
      @keyframes key-alarm {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(15deg); }
        75% { transform: rotate(-15deg); }
      }
      @keyframes spark-hit-left {
        0%, 100% { opacity: 1; transform: scale(1.2); }
        50% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes spark-hit-right {
        0%, 100% { opacity: 0; transform: scale(0.3); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      #body-js { animation: alarm-shake 0.12s ease-in-out infinite; transform-origin: 5px 18px; }
      #shadow-js { animation: shadow-alarm 0.12s ease-in-out infinite; transform-origin: 5px 18px; }
      #alarm-hammer { animation: hammer-ring 0.12s ease-in-out infinite; transform-origin: 5px -5px; }
      #bell-left { animation: bell-hit-left 0.12s ease-in-out infinite; transform-origin: -3px -7px; }
      #bell-right { animation: bell-hit-right 0.12s ease-in-out infinite; transform-origin: 13px -7px; }
      #sound-waves { animation: sound-waves 0.48s ease-out infinite; transform-origin: 5px -8px; }
      #eyes-js { animation: alarm-eyes 0.24s ease-in-out infinite; transform-origin: 5px 2px; }
      #arm-left { animation: arms-alarm 0.12s ease-in-out infinite; transform-origin: -7px 3px; }
      #arm-right { animation: arms-alarm 0.12s ease-in-out infinite reverse; transform-origin: 17px 3px; }
      #windup-key { animation: key-alarm 0.12s ease-in-out infinite; transform-origin: -7px 2px; }
      #clock-hands { animation: hands-alarm 0.12s ease-in-out infinite; transform-origin: 5px 2px; }
      #alarm-led { animation: led-pulse 0.24s ease-in-out infinite; transform-origin: 5px -3.5px; }
      #center-hub { animation: led-pulse 0.24s ease-in-out infinite; transform-origin: 5px 2px; }
      #spark-left { animation: spark-hit-left 0.12s ease-in-out infinite; transform-origin: -1px -7px; }
      #spark-right { animation: spark-hit-right 0.12s ease-in-out infinite; transform-origin: 11px -7px; }
    </style>
  </defs>

  <!-- 1. Shadow layer (#shadow-js) -->
  <g id="shadow-js" style="transform-origin: 5px 18px">
    <ellipse cx="5" cy="18" rx="9.5" ry="2.2" fill="rgba(0,0,0,0.15)"/>
  </g>

  <!-- 2. Windup key layer (#windup-key) -->
  <g id="windup-key" style="transform-origin: -7px 2px">
    <path d="M -7 2 L -11 2" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-12" cy="2" r="2.2" fill="none" stroke="#4B5563" stroke-width="1.2"/>
  </g>

  <!-- 3. Mechanical body & chassis (#body-js) -->
  <g id="body-js">
    <!-- 3.1 Mechanical feet (#feet) -->
    <g id="feet">
      <g id="leg-left" style="transform-origin: 1px 13px">
        <line x1="1" y1="13" x2="0" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="0" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
      <g id="leg-right" style="transform-origin: 9px 13px">
        <line x1="9" y1="13" x2="10" y2="17.5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="10" cy="17.5" rx="2.5" ry="1.2" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.2 Clock shell (#clock-shell) -->
    <g id="clock-shell">
      <circle cx="5" cy="2" r="12" fill="url(#clock-case-grad)" stroke="#1F2937" stroke-width="1.2"/>
      <!-- Bottom brackets -->
      <polygon points=" -4,11 -6,14 -3,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
      <polygon points=" 14,11 16,14 13,13 " fill="#B87326" stroke="#1F2937" stroke-width="0.8"/>
    </g>

    <!-- 3.3 Dial & ticks (#dial-group) -->
    <g id="dial-group">
      <circle cx="5" cy="2" r="9.2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <circle cx="5" cy="-6" r="0.6" fill="#64748B"/>
      <circle cx="13" cy="2" r="0.6" fill="#64748B"/>
      <circle cx="5" cy="10" r="0.6" fill="#64748B"/>
      <circle cx="-3" cy="2" r="0.6" fill="#64748B"/>
      <!-- Alert LED indicator under 12 o'clock -->
      <circle id="alarm-led" cx="5" cy="-3.5" r="0.9" fill="#EF4444" stroke="#DC2626" stroke-width="0.4"/>
    </g>

    <!-- 3.4 Clock hands (#clock-hands) -->
    <g id="clock-hands" style="transform-origin: 5px 2px">
      <line id="hour-hand" x1="5" y1="2" x2="5" y2="-2.5" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round"/>
      <line id="minute-hand" x1="5" y1="2" x2="9" y2="2" stroke="#1E293B" stroke-width="1.0" stroke-linecap="round"/>
      <circle id="center-hub" cx="5" cy="2" r="1.3" fill="#EF4444" stroke="#1F2937" stroke-width="0.6"/>
    </g>

    <!-- 3.5 Wide open alert eyes (#eyes-js) -->
    <g id="eyes-js" style="transform-origin: 5px 2px">
      <!-- Arched alert eyebrows -->
      <path d="M 0.2 -2.2 Q 2 -3.4 3.8 -2.2" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      <path d="M 6.2 -2.2 Q 8 -3.4 9.8 -2.2" stroke="#1E293B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
      <!-- Left eye -->
      <g id="eye-left">
        <ellipse cx="2" cy="0.5" rx="2.4" ry="2.9" fill="#0F172A"/>
        <circle cx="1.2" cy="-0.7" r="0.9" fill="#FFFFFF"/>
        <circle cx="2.7" cy="1.6" r="0.45" fill="#FFFFFF"/>
      </g>
      <!-- Right eye -->
      <g id="eye-right">
        <ellipse cx="8" cy="0.5" rx="2.4" ry="2.9" fill="#0F172A"/>
        <circle cx="7.2" cy="-0.7" r="0.9" fill="#FFFFFF"/>
        <circle cx="8.7" cy="1.6" r="0.45" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 3.6 Twin bells & vibrating hammer (#bell-rig) -->
    <g id="bell-rig">
      <!-- Left bell -->
      <g id="bell-left" style="transform-origin: -3px -7px">
        <path d="M -7 -6 C -7 -11 -1 -11 -1 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <!-- Right bell -->
      <g id="bell-right" style="transform-origin: 13px -7px">
        <path d="M 11 -6 C 11 -11 17 -11 17 -6 Z" fill="url(#bell-grad)" stroke="#1F2937" stroke-width="1"/>
      </g>
      <!-- Strike sparks at impact points -->
      <g id="spark-left" style="transform-origin: -1px -7px">
        <line x1="-2.5" y1="-7" x2="0.5" y2="-7" stroke="#FEF08A" stroke-width="0.8" stroke-linecap="round"/>
        <line x1="-1" y1="-8.5" x2="-1" y2="-5.5" stroke="#FEF08A" stroke-width="0.8" stroke-linecap="round"/>
        <circle cx="-1" cy="-7" r="0.6" fill="#FBBF24"/>
      </g>
      <g id="spark-right" style="transform-origin: 11px -7px">
        <line x1="9.5" y1="-7" x2="12.5" y2="-7" stroke="#FEF08A" stroke-width="0.8" stroke-linecap="round"/>
        <line x1="11" y1="-8.5" x2="11" y2="-5.5" stroke="#FEF08A" stroke-width="0.8" stroke-linecap="round"/>
        <circle cx="11" cy="-7" r="0.6" fill="#FBBF24"/>
      </g>
      <!-- Rapid oscillating hammer -->
      <g id="alarm-hammer" style="transform-origin: 5px -5px">
        <line x1="5" y1="-5" x2="5" y2="-9.8" stroke="#4B5563" stroke-width="1.3"/>
        <circle cx="5" cy="-9.8" r="1.3" fill="#1F2937"/>
      </g>
    </g>

    <!-- 3.7 Acoustic sound waves radiating from bells (#sound-waves) -->
    <g id="sound-waves" style="transform-origin: 5px -8px">
      <!-- Inner wave arc group -->
      <g id="sound-wave-inner">
        <path d="M -7.5 -13 A 6 6 0 0 0 -7.5 -4" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path d="M 17.5 -13 A 6 6 0 0 1 17.5 -4" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path d="M 1.5 -13.5 Q 5 -16 8.5 -13.5" stroke="#F59E0B" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Middle wave arc group -->
      <g id="sound-wave-mid">
        <path d="M -10.5 -15.5 A 9.5 9.5 0 0 0 -10.5 -1.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path d="M 20.5 -15.5 A 9.5 9.5 0 0 1 20.5 -1.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path d="M -1.5 -16.5 Q 5 -19.5 11.5 -16.5" stroke="#F59E0B" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Outer shockwave arc group -->
      <g id="sound-wave-outer">
        <path d="M -13.5 -18 A 13 13 0 0 0 -13.5 1" stroke="#EF4444" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2.5 1.5" fill="none"/>
        <path d="M 23.5 -18 A 13 13 0 0 1 23.5 1" stroke="#EF4444" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2.5 1.5" fill="none"/>
        <path d="M -4 -19.5 Q 5 -23.5 14 -19.5" stroke="#EF4444" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 1.5" fill="none"/>
      </g>
    </g>

    <!-- 3.8 Frantically waving raised arms (#arms) -->
    <g id="arms">
      <g id="arm-left" style="transform-origin: -7px 3px">
        <path d="M -7 3 Q -12 1 -11 -4" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="-11" cy="-4.5" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
      <g id="arm-right" style="transform-origin: 17px 3px">
        <path d="M 17 3 Q 22 1 21 -4" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="21" cy="-4.5" r="1.4" fill="#E29D42" stroke="#1F2937" stroke-width="0.8"/>
      </g>
    </g>
  </g>
</svg>
