<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. 黄色竹蜻蜓 (Take-copter) -->
    <g id="gadget-takecopter">
      <rect x="-0.6" y="-3" width="1.2" height="4" rx="0.5" fill="#FFD166" stroke="#24292E" stroke-width="0.5"/>
      <ellipse cx="0" cy="-3.5" rx="5.5" ry="1" fill="#FFD166" stroke="#24292E" stroke-width="0.5"/>
      <circle cx="0" cy="-3.5" r="0.7" fill="#E63946"/>
    </g>

    <!-- 2. 记忆面包 (Memory Bread) -->
    <g id="gadget-bread">
      <rect x="-4" y="-5" width="8" height="10" rx="1.5" fill="#FFE8D6" stroke="#B07D62" stroke-width="0.8"/>
      <text x="-3" y="-1" font-size="2" fill="#B07D62" font-family="monospace">1+1=2</text>
      <text x="-3" y="2" font-size="2" fill="#B07D62" font-family="monospace">e=mc²</text>
    </g>

    <!-- 3. 缩小灯 (Small Light) -->
    <g id="gadget-small-light">
      <path d="M -2 0 L 2 0 L 3 6 L -3 6 Z" fill="#2A9D8F" stroke="#24292E" stroke-width="0.6"/>
      <ellipse cx="0" cy="6" rx="3" ry="1" fill="#E76F51"/>
      <rect x="-1" y="-3" width="2" height="3" rx="0.5" fill="#24292E"/>
    </g>

    <!-- 4. 时间包袱皮 (Time Furoshiki) -->
    <g id="gadget-furoshiki">
      <ellipse cx="0" cy="0" rx="9" ry="6" fill="#F4A261" stroke="#E76F51" stroke-width="0.8"/>
      <path d="M -3 -1 Q 0 -3 3 -1" fill="none" stroke="#FFFFFF" stroke-width="0.6"/>
    </g>

    <!-- 5. 经典红豆铜锣烧 (Dorayaki) -->
    <g id="gadget-dorayaki">
      <ellipse cx="0" cy="0" rx="4.5" ry="2.2" fill="#EAA156" stroke="#24292E" stroke-width="0.8"/>
      <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#4A1508" stroke-width="0.8"/>
    </g>
  </defs>
</svg>
