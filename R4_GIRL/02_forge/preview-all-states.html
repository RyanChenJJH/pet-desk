<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R4 Girl SVG Preview</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4e6d8;
      color: #3b2618;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }
    figure {
      margin: 0;
      padding: 14px;
      border: 1px solid rgba(83, 49, 25, .18);
      border-radius: 8px;
      background: #fff7ef;
    }
    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border: 0;
      background: linear-gradient(#fffdf7, #ffe3c7);
      border-radius: 6px;
    }
    figcaption {
      margin-top: 8px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>R4 Girl SVG States</h1>
    <div class="grid">
      <figure><iframe src="../theme/assets/idle-follow.svg"></iframe><figcaption>idle-follow</figcaption></figure>
      <figure><iframe src="../theme/assets/working.svg"></iframe><figcaption>working</figcaption></figure>
      <figure><iframe src="../theme/assets/thinking.svg"></iframe><figcaption>thinking</figcaption></figure>
      <figure><iframe src="../theme/assets/notification.svg"></iframe><figcaption>notification</figcaption></figure>
      <figure><iframe src="../theme/assets/sleeping.svg"></iframe><figcaption>sleeping</figcaption></figure>
      <figure><iframe src="../theme/assets/roam.svg"></iframe><figcaption>roam</figcaption></figure>
    </div>
  </main>
</body>
</html>
