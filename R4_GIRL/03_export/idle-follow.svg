<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" role="img" aria-label="R4 girl idle follow">
  <defs>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffe3c8"/><stop offset="100%" stop-color="#f6b17d"/></radialGradient>
    <linearGradient id="hair" x1="-10" y1="-18" x2="10" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#9d4b22"/><stop offset="100%" stop-color="#6e2f18"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="3" x2="0" y2="18" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffad46"/><stop offset="100%" stop-color="#e96f23"/></linearGradient>
    <style>
      #body-js,.pet,#eyes-js,#shadow-js,.hair,.flower,.hand{transform-box:view-box;transform-origin:center}
      .pet{animation:idle-breathe 3.2s ease-in-out infinite}
      .hair{animation:idle-hair 3.2s ease-in-out infinite}
      .flower{animation:idle-flower 3.2s ease-in-out infinite}
      #eyes-js{animation:idle-eyes 4.6s ease-in-out infinite}
      .hand{animation:idle-hand 3.2s ease-in-out infinite}
      .shadow-shape{animation:idle-shadow 3.2s ease-in-out infinite;transform-origin:center}
      @keyframes idle-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.55px) scale(1.015)}}
      @keyframes idle-hair{0%,100%{transform:rotate(0deg)}50%{transform:rotate(.7deg)}}
      @keyframes idle-flower{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
      @keyframes idle-eyes{0%,100%{transform:translate(0,0)}50%{transform:translate(.25px,.12px)}}
      @keyframes idle-hand{0%,100%{transform:translate(4.7px,3.9px) rotate(-10deg)}50%{transform:translate(4.55px,3.55px) rotate(-8deg)}}
      @keyframes idle-shadow{0%,100%{transform:scale(1);opacity:.18}50%{transform:scale(.94);opacity:.14}}
    </style>
  </defs>
  <g id="shadow-js"><ellipse class="shadow-shape" cx="0" cy="18" rx="10.5" ry="2.1" fill="#6b341d" opacity=".18"/></g>
  <g id="body-js">
    <g class="pet">
      <path d="M-8.5 17.2 C-7.4 8 -4.5 4.4 0 4.4 C4.5 4.4 7.4 8 8.5 17.2 Z" fill="url(#dress)"/>
      <circle cx="-3.8" cy="10.2" r="1" fill="#fff4d9" opacity=".9"/><circle cx="3.9" cy="11.2" r=".9" fill="#fff4d9" opacity=".85"/>
      <path d="M-1.7 4.6 L1.7 4.6 L1.2 7.6 L-1.2 7.6 Z" fill="#f4a36f"/>
      <g class="hair">
        <circle cx="-9.6" cy="-7.7" r="5.8" fill="url(#hair)"/><circle cx="9.6" cy="-7.7" r="5.8" fill="url(#hair)"/>
        <path d="M-10.6 -4.2 C-8 -16 8 -16 10.6 -4.2 C10.9 5 6.5 9.1 0 9.1 C-6.5 9.1 -10.9 5 -10.6 -4.2Z" fill="url(#hair)"/>
      </g>
      <path d="M-8.8 -4.9 C-8.8 -11.1 -4.7 -14.4 0 -14.4 C4.7 -14.4 8.8 -11.1 8.8 -4.9 C8.8 3.2 5.3 7.9 0 7.9 C-5.3 7.9 -8.8 3.2 -8.8 -4.9Z" fill="url(#skin)"/>
      <path d="M-8.8 -5.5 C-6.2 -12.6 3.3 -15.4 9.1 -6.6 C5.7 -8.7 2.2 -9.2 -1.2 -8.2 C-4.3 -7.2 -6.6 -6.5 -8.8 -5.5Z" fill="#7a3418"/>
      <g class="flower" transform="translate(-10.8 -12.2) rotate(-18)"><circle r="1" fill="#ffd75d"/><ellipse cy="-1.5" rx=".9" ry="1.4" fill="#fff8ef"/><ellipse cx="1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(72)"/><ellipse cx=".8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(144)"/><ellipse cx="-.8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(216)"/><ellipse cx="-1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(288)"/></g>
      <g class="flower" transform="translate(10.8 -12.2) rotate(18)"><circle r="1" fill="#ffd75d"/><ellipse cy="-1.5" rx=".9" ry="1.4" fill="#fff8ef"/><ellipse cx="1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(72)"/><ellipse cx=".8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(144)"/><ellipse cx="-.8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(216)"/><ellipse cx="-1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(288)"/></g>
      <ellipse cx="-4.9" cy=".7" rx="2.9" ry="2.1" fill="#ff8a34" opacity=".72"/><ellipse cx="4.9" cy=".7" rx="2.9" ry="2.1" fill="#ff8a34" opacity=".72"/>
      <circle cx="-5.9" cy=".4" r=".35" fill="#8f3a1c" opacity=".55"/><circle cx="-4.2" cy="1.3" r=".32" fill="#8f3a1c" opacity=".5"/><circle cx="4.2" cy="1.3" r=".32" fill="#8f3a1c" opacity=".5"/><circle cx="5.9" cy=".4" r=".35" fill="#8f3a1c" opacity=".55"/>
      <g id="eyes-js">
        <path d="M-5.9 -4.1 C-4.6 -5.2 -3.2 -5.2 -2 -4.1" fill="none" stroke="#5b2818" stroke-width="1.05" stroke-linecap="round"/>
        <path d="M2 -4.1 C3.2 -5.2 4.6 -5.2 5.9 -4.1" fill="none" stroke="#5b2818" stroke-width="1.05" stroke-linecap="round"/>
        <path d="M-6.4 -7.4 C-4.8 -8.4 -3.3 -8.2 -1.7 -7.2" fill="none" stroke="#4a2115" stroke-width="1.15" stroke-linecap="round"/>
        <path d="M1.7 -7.2 C3.3 -8.2 4.8 -8.4 6.4 -7.4" fill="none" stroke="#4a2115" stroke-width="1.15" stroke-linecap="round"/>
      </g>
      <g class="hand">
        <path d="M-2.1 4.8 C-4.5 2.5 -4.2 -1.4 -1.3 -2.2 C1.6 -3 4 0 3.4 3.3 C3 5.5 .3 6.5 -2.1 4.8Z" fill="#ffd4af" stroke="#a5522a" stroke-width=".55"/>
        <path d="M-.7 -1.7 C-.4 -6.9 1.1 -9.6 2.3 -9.2 C3.5 -8.8 2.8 -4.9 1.9 -1.4" fill="#ffd4af" stroke="#a5522a" stroke-width=".6" stroke-linecap="round"/>
        <path d="M1.1 -1.6 C4.1 -6.1 6.2 -7.9 7.1 -7 C8 -6.1 5.4 -3.2 2.7 -.8" fill="#ffd4af" stroke="#a5522a" stroke-width=".6" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>

