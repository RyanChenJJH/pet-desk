<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" role="img" aria-label="R4 girl roaming facing right">
  <defs>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffe3c8"/><stop offset="100%" stop-color="#f6b17d"/></radialGradient>
    <linearGradient id="hair" x1="-10" y1="-18" x2="10" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#9d4b22"/><stop offset="100%" stop-color="#6e2f18"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="3" x2="0" y2="18" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffad46"/><stop offset="100%" stop-color="#e96f23"/></linearGradient>
    <style>
      #body-js,.pet,.hair,.hand,.shadow-shape,.speed{transform-box:view-box;transform-origin:center}
      .pet{animation:roam-glide 1.8s ease-in-out infinite}
      .hair{animation:roam-hair 1.8s ease-in-out infinite}
      .hand{animation:roam-hand 1.8s ease-in-out infinite}
      .speed{animation:roam-speed 1.8s ease-in-out infinite}
      .shadow-shape{animation:roam-shadow 1.8s ease-in-out infinite;transform-origin:center}
      @keyframes roam-glide{0%,100%{transform:translateX(0) translateY(0) rotate(0deg)}50%{transform:translateX(1.1px) translateY(-.55px) rotate(2deg)}}
      @keyframes roam-hair{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(-.45px) rotate(-1.2deg)}}
      @keyframes roam-hand{0%,100%{transform:translate(5.2px,3.9px) rotate(-4deg)}50%{transform:translate(5.55px,3.45px) rotate(1deg)}}
      @keyframes roam-speed{0%,100%{opacity:.12;transform:translateX(0)}50%{opacity:.55;transform:translateX(-1px)}}
      @keyframes roam-shadow{0%,100%{transform:translateX(0) scale(1);opacity:.18}50%{transform:translateX(1px) scale(.95);opacity:.15}}
    </style>
  </defs>
  <g id="shadow-js"><ellipse class="shadow-shape" cx="0" cy="18" rx="10.5" ry="2.1" fill="#6b341d" opacity=".18"/></g>
  <g id="body-js"><g class="pet" transform="translate(1 0) skewY(-1)">
    <path d="M-8.5 17.2 C-7.4 8 -4.5 4.4 0 4.4 C4.5 4.4 7.4 8 8.5 17.2 Z" fill="url(#dress)"/><path d="M-1.7 4.6 L1.7 4.6 L1.2 7.6 L-1.2 7.6 Z" fill="#f4a36f"/>
    <g class="hair"><circle cx="-9.6" cy="-7.7" r="5.8" fill="url(#hair)"/><circle cx="9.6" cy="-7.7" r="5.8" fill="url(#hair)"/><path d="M-10.6 -4.2 C-8 -16 8 -16 10.6 -4.2 C10.9 5 6.5 9.1 0 9.1 C-6.5 9.1 -10.9 5 -10.6 -4.2Z" fill="url(#hair)"/></g>
    <path d="M-8.8 -4.9 C-8.8 -11.1 -4.7 -14.4 0 -14.4 C4.7 -14.4 8.8 -11.1 8.8 -4.9 C8.8 3.2 5.3 7.9 0 7.9 C-5.3 7.9 -8.8 3.2 -8.8 -4.9Z" fill="url(#skin)"/><path d="M-8.4 -5.5 C-5.7 -12.8 3.9 -15.2 9.3 -6.4 C6.3 -8.5 2.8 -9 -1 -8 C-3.8 -7.2 -6.2 -6.5 -8.4 -5.5Z" fill="#7a3418"/>
    <g transform="translate(-10.8 -12.2) rotate(-18)"><circle r="1" fill="#ffd75d"/><ellipse cy="-1.5" rx=".9" ry="1.4" fill="#fff8ef"/><ellipse cx="1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(72)"/><ellipse cx=".8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(144)"/><ellipse cx="-.8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(216)"/><ellipse cx="-1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(288)"/></g>
    <g transform="translate(10.8 -12.2) rotate(18)"><circle r="1" fill="#ffd75d"/><ellipse cy="-1.5" rx=".9" ry="1.4" fill="#fff8ef"/><ellipse cx="1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(72)"/><ellipse cx=".8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(144)"/><ellipse cx="-.8" cy="1.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(216)"/><ellipse cx="-1.4" cy="-.2" rx=".9" ry="1.4" fill="#fff8ef" transform="rotate(288)"/></g>
    <ellipse cx="-4.6" cy=".8" rx="2.5" ry="1.9" fill="#ff8a34" opacity=".68"/><ellipse cx="5.2" cy=".6" rx="3.1" ry="2.1" fill="#ff8a34" opacity=".74"/>
    <g id="eyes-js"><path d="M-5.5 -4 C-4.1 -5 -2.8 -5 -1.7 -4" fill="none" stroke="#5b2818" stroke-width="1.05" stroke-linecap="round"/><path d="M2.2 -4 C3.4 -5.2 4.9 -5.2 6.3 -4" fill="none" stroke="#5b2818" stroke-width="1.05" stroke-linecap="round"/><path d="M-6 -7.3 C-4.5 -8.3 -3.1 -8.1 -1.5 -7.1" fill="none" stroke="#4a2115" stroke-width="1.15" stroke-linecap="round"/><path d="M2 -7.2 C3.5 -8.2 5 -8.4 6.6 -7.4" fill="none" stroke="#4a2115" stroke-width="1.15" stroke-linecap="round"/></g>
    <g class="hand"><path d="M-2.1 4.8 C-4.5 2.5 -4.2 -1.4 -1.3 -2.2 C1.6 -3 4 0 3.4 3.3 C3 5.5 .3 6.5 -2.1 4.8Z" fill="#ffd4af" stroke="#a5522a" stroke-width=".55"/><path d="M-.7 -1.7 C-.4 -6.9 1.1 -9.6 2.3 -9.2 C3.5 -8.8 2.8 -4.9 1.9 -1.4" fill="#ffd4af" stroke="#a5522a" stroke-width=".6" stroke-linecap="round"/><path d="M1.1 -1.6 C4.1 -6.1 6.2 -7.9 7.1 -7 C8 -6.1 5.4 -3.2 2.7 -.8" fill="#ffd4af" stroke="#a5522a" stroke-width=".6" stroke-linecap="round"/></g>
    <g class="speed" fill="none" stroke="#f6b17d" stroke-linecap="round" opacity=".35"><path d="M-16 -5 L-12 -5"/><path d="M-17 1 L-12.8 1"/><path d="M-15 7 L-12 7"/></g>
  </g></g>
</svg>

