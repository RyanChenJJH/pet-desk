<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fish-wood-grad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="92%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <linearGradient id="fish-tail-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <radialGradient id="mallet-head-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>

    <linearGradient id="mallet-handle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <style>
    /* 深呼吸安睡起伏 (3.6s 循环) */
    @keyframes fish-sleep {
      0%, 100% {
        transform: scale(1.08, 0.88); /* 呼气到底，软趴趴贴地 */
      }
      45% {
        transform: scale(1.03, 0.96); /* 吸气微隆起 */
      }
      60% {
        transform: scale(1.03, 0.96); /* 屏气稍歇 */
      }
    }

    /* 地面接触阴影平缓舒张 */
    @keyframes shadow-sleep {
      0%, 100% {
        transform: scale(1.12, 1.05);
        opacity: 0.25;
      }
      45%, 60% {
        transform: scale(1.02, 0.98);
        opacity: 0.18;
      }
    }

    /* 横卧小木槌打呼微颤 */
    @keyframes mallet-sleep {
      0%, 100% {
        transform: translate(2px, 14px) rotate(68deg);
      }
      45%, 60% {
        transform: translate(2px, 13px) rotate(66deg);
      }
    }

    /* 睡眠 "z" 字符逐级漂浮渐隐 */
    @keyframes zzz-float-1 {
      0%, 100% {
        transform: translate(2px, 0px) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      65% {
        transform: translate(6px, -10px) scale(1.0);
        opacity: 0.8;
      }
      85% {
        transform: translate(8px, -15px) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes zzz-float-2 {
      0%, 30% {
        transform: translate(4px, 2px) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.85;
      }
      80% {
        transform: translate(9px, -9px) scale(1.1);
        opacity: 0.8;
      }
      98%, 100% {
        transform: translate(12px, -16px) scale(1.3);
        opacity: 0;
      }
    }

    #fish-body-sleep {
      transform-origin: 0px 17.5px;
      animation: fish-sleep 3.6s ease-in-out infinite;
    }

    #shadow-sleep {
      transform-origin: 0px 17.5px;
      animation: shadow-sleep 3.6s ease-in-out infinite;
    }

    #mallet-sleep {
      transform-origin: 10px 16.5px;
      animation: mallet-sleep 3.6s ease-in-out infinite;
    }

    #sleep-z1 {
      animation: zzz-float-1 3.6s ease-out infinite;
    }

    #sleep-z2 {
      animation: zzz-float-2 3.6s ease-out infinite;
    }
  </style>

  <!-- 1. 地面投影层 -->
  <g id="shadow-js">
    <g id="shadow-sleep">
      <ellipse cx="0" cy="17.5" rx="11" ry="2.4" fill="rgba(60,26,6,0.2)"/>
    </g>
  </g>

  <!-- 2. 木鱼主体躯干层 (软趴安睡姿态) -->
  <g id="body-js">
    <g id="fish-body-sleep">
      <!-- 卷尾 -->
      <path id="fish-tail" d="M -9 6 C -12 3, -15 7, -13 11 C -11.5 13.5, -8 13.5, -7 11 C -8 9.5, -8 7.5, -9 6 Z"
            fill="url(#fish-tail-grad)" stroke="#3C1A06" stroke-width="0.8" stroke-linejoin="round"/>

      <!-- 主球体 -->
      <path id="fish-shell" d="M -10 11 C -11 6, -9 -1, -2 -3 C 3 -4.5, 9 -2, 11 4 C 12.5 8, 12 13, 8 16 C 4 17.5, -5 17.5, -9 15 C -10.5 13.8, -10.5 12.2, -10 11 Z"
            fill="url(#fish-wood-grad)" stroke="#3C1A06" stroke-width="0.9" stroke-linejoin="round"/>

      <!-- 顶部高光弧 -->
      <path d="M -5 -0.5 C -1 -2, 4 -2, 7 1.5"
            fill="none" stroke="#FEF3C7" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>

      <!-- 雕刻纹线 -->
      <g id="carved-lines" opacity="0.55">
        <path d="M -7 4 C -5 2, -1 2, 1 3.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
        <path d="M 3 2.5 C 5 2.5, 8 4, 9 6.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
      </g>

      <!-- 发音横缝 -->
      <g id="fish-slit">
        <path d="M -6.5 12.5 Q 0 14.5 7.5 12 Q 9 12 9.5 13 Q 9 14.2 7 14.5 Q 0 16 -6.5 14 Q -8 13.5 -8 12.8 Z"
              fill="#451A03" stroke="#3C1A06" stroke-width="0.6"/>
        <circle cx="-6.2" cy="13.2" r="1.1" fill="#2E1002"/>
        <circle cx="7.2" cy="13.2" r="1.1" fill="#2E1002"/>
      </g>

      <!-- 软糯腮红 -->
      <g id="blush">
        <ellipse cx="-6" cy="8.6" rx="1.6" ry="1.0" fill="rgba(244,63,94,0.38)"/>
        <ellipse cx="6" cy="8.6" rx="1.6" ry="1.0" fill="rgba(244,63,94,0.38)"/>
      </g>

      <!-- 安睡闭眼弧线 (#eyes-js) -->
      <g id="eyes-js">
        <!-- 左闭眼弧线 -->
        <path d="M -5.2 6.6 Q -3.6 5.4 -2.0 6.6" fill="none" stroke="#18181B" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 右闭眼弧线 -->
        <path d="M 2.0 6.6 Q 3.6 5.4 5.2 6.6" fill="none" stroke="#18181B" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 3. 横卧小木槌层 (平躺地面休息) -->
  <g id="mallet-js">
    <g id="mallet-sleep">
      <ellipse cx="10" cy="17.2" rx="4.0" ry="1.0" fill="rgba(60,26,6,0.18)"/>
      <path d="M 9.5 3 L 13 -7.5" stroke="url(#mallet-handle-grad)" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="11.2" y="-4" width="2" height="1.2" rx="0.5" fill="#DC2626" transform="rotate(-65 12 -3.5)"/>
      <ellipse cx="8.5" cy="-3.5" rx="3.2" ry="2.4" fill="url(#mallet-head-grad)" stroke="#3C1A06" stroke-width="0.75" transform="rotate(-25 8.5 -3.5)"/>
      <circle cx="7.8" cy="-4.2" r="0.7" fill="#FEF3C7" opacity="0.75"/>
    </g>
  </g>

  <!-- 4. 浮空梦境 z Z Z 字符 (#effects-js) -->
  <g id="effects-js">
    <g id="sleep-z1" opacity="0">
      <text x="3" y="1" font-family="'Comic Sans MS', sans-serif" font-size="3.8" font-weight="bold" fill="#FBBF24" opacity="0.9">z</text>
    </g>
    <g id="sleep-z2" opacity="0">
      <text x="6" y="-3" font-family="'Comic Sans MS', sans-serif" font-size="5.2" font-weight="bold" fill="#F59E0B" opacity="0.95">Z</text>
    </g>
  </g>
</svg>
