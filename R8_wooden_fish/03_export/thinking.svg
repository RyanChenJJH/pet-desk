<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fish-wood-grad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="92%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <linearGradient id="fish-tail-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <radialGradient id="mallet-head-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>

    <linearGradient id="mallet-handle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gold-q-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <style>
    /* 木鱼身体微倾与仰望思考律动 (2.4s 循环) */
    @keyframes fish-think {
      0%, 100% {
        transform: rotate(0deg) translateY(0px);
      }
      50% {
        transform: rotate(-3.5deg) translateY(-1px);
      }
    }

    /* 眼睛向上仰望呆萌微移 */
    @keyframes eyes-look-up {
      0%, 100% {
        transform: translate(0px, 0px);
      }
      30%, 70% {
        transform: translate(0.6px, -1.2px);
      }
    }

    /* 小木槌头顶钟摆式悬浮摇摆 */
    @keyframes mallet-pendulum {
      0%, 100% {
        transform: rotate(-10deg) translateY(0px);
      }
      50% {
        transform: rotate(14deg) translateY(-2px);
      }
    }

    /* 禅意思考气泡浮动 1 */
    @keyframes bubble-rise-1 {
      0%, 100% {
        transform: translateY(0px) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      60% {
        transform: translateY(-8px) scale(1.1);
        opacity: 0.8;
      }
      80%, 100% {
        transform: translateY(-14px) scale(1.2);
        opacity: 0;
      }
    }

    /* 禅意思考气泡浮动 2 (相位差) */
    @keyframes bubble-rise-2 {
      0%, 30% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      45% {
        opacity: 0.85;
      }
      75% {
        transform: translateY(-9px) scale(1.0);
        opacity: 0.85;
      }
      95%, 100% {
        transform: translateY(-15px) scale(1.2);
        opacity: 0;
      }
    }

    /* 金色小问号浮升 */
    @keyframes question-rise {
      0%, 40% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      55% {
        opacity: 0.95;
        transform: translateY(-3px) scale(1.1);
      }
      80% {
        transform: translateY(-8px) scale(1.0);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-13px) scale(0.8);
        opacity: 0;
      }
    }

    #fish-think-group {
      transform-origin: 0px 17.5px;
      animation: fish-think 2.4s ease-in-out infinite;
    }

    #eyes-think-group {
      animation: eyes-look-up 2.4s ease-in-out infinite;
    }

    #mallet-think-group {
      transform-origin: 10px -2px;
      animation: mallet-pendulum 2.4s ease-in-out infinite;
    }

    #bubble-1 {
      animation: bubble-rise-1 2.4s ease-out infinite;
    }

    #bubble-2 {
      animation: bubble-rise-2 2.4s ease-out infinite;
    }

    #think-q {
      animation: question-rise 2.4s ease-out infinite;
    }
  </style>

  <!-- 1. 地面投影层 -->
  <g id="shadow-js">
    <ellipse cx="0" cy="17.5" rx="11" ry="2.4" fill="rgba(60,26,6,0.2)"/>
  </g>

  <!-- 2. 木鱼主体躯干层 -->
  <g id="body-js">
    <g id="fish-think-group">
      <!-- 卷尾 -->
      <path id="fish-tail" d="M -9 6 C -12 3, -15 7, -13 11 C -11.5 13.5, -8 13.5, -7 11 C -8 9.5, -8 7.5, -9 6 Z"
            fill="url(#fish-tail-grad)" stroke="#3C1A06" stroke-width="0.8" stroke-linejoin="round"/>

      <!-- 主球体 -->
      <path id="fish-shell" d="M -10 11 C -11 6, -9 -1, -2 -3 C 3 -4.5, 9 -2, 11 4 C 12.5 8, 12 13, 8 16 C 4 17.5, -5 17.5, -9 15 C -10.5 13.8, -10.5 12.2, -10 11 Z"
            fill="url(#fish-wood-grad)" stroke="#3C1A06" stroke-width="0.9" stroke-linejoin="round"/>

      <!-- 顶部高光弧 -->
      <path d="M -5 -0.5 C -1 -2, 4 -2, 7 1.5"
            fill="none" stroke="#FEF3C7" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>

      <!-- 雕刻纹线 -->
      <g id="carved-lines" opacity="0.55">
        <path d="M -7 4 C -5 2, -1 2, 1 3.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
        <path d="M 3 2.5 C 5 2.5, 8 4, 9 6.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
      </g>

      <!-- 发音横缝 -->
      <g id="fish-slit">
        <path d="M -6.5 12.5 Q 0 14.5 7.5 12 Q 9 12 9.5 13 Q 9 14.2 7 14.5 Q 0 16 -6.5 14 Q -8 13.5 -8 12.8 Z"
              fill="#451A03" stroke="#3C1A06" stroke-width="0.6"/>
        <circle cx="-6.2" cy="13.2" r="1.1" fill="#2E1002"/>
        <circle cx="7.2" cy="13.2" r="1.1" fill="#2E1002"/>
      </g>

      <!-- 腮红 -->
      <g id="blush">
        <ellipse cx="-6" cy="8.2" rx="1.5" ry="0.9" fill="rgba(244,63,94,0.42)"/>
        <ellipse cx="6" cy="8.2" rx="1.5" ry="0.9" fill="rgba(244,63,94,0.42)"/>
      </g>

      <!-- 仰望大眼 (#eyes-js) -->
      <g id="eyes-js">
        <g id="eyes-think-group">
          <!-- 左眼 -->
          <g id="eye-left">
            <circle cx="-3.6" cy="6.2" r="1.7" fill="#18181B"/>
            <circle cx="-3.4" cy="5.2" r="0.6" fill="#FFFFFF"/>
            <circle cx="-3.0" cy="7.0" r="0.25" fill="#FFFFFF" opacity="0.8"/>
          </g>
          <!-- 右眼 -->
          <g id="eye-right">
            <circle cx="3.6" cy="6.2" r="1.7" fill="#18181B"/>
            <circle cx="3.8" cy="5.2" r="0.6" fill="#FFFFFF"/>
            <circle cx="4.2" cy="7.0" r="0.25" fill="#FFFFFF" opacity="0.8"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 3. 悬浮小木槌层 (钟摆式摇摆) -->
  <g id="mallet-js">
    <g id="mallet-think-group">
      <ellipse cx="10" cy="16.5" rx="3.5" ry="1.0" fill="rgba(60,26,6,0.12)"/>
      <path d="M 9.5 3 L 13 -7.5" stroke="url(#mallet-handle-grad)" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="11.2" y="-4" width="2" height="1.2" rx="0.5" fill="#DC2626" transform="rotate(-65 12 -3.5)"/>
      <ellipse cx="8.5" cy="-3.5" rx="3.2" ry="2.4" fill="url(#mallet-head-grad)" stroke="#3C1A06" stroke-width="0.75" transform="rotate(-25 8.5 -3.5)"/>
      <circle cx="7.8" cy="-4.2" r="0.7" fill="#FEF3C7" opacity="0.75"/>
    </g>
  </g>

  <!-- 4. 浮空禅意思考气泡与小问号 (#effects-js) -->
  <g id="effects-js">
    <!-- 思考气泡 1 -->
    <circle id="bubble-1" cx="-4" cy="-5" r="1.2" fill="#FEF08A" stroke="#F59E0B" stroke-width="0.4" opacity="0"/>
    <!-- 思考气泡 2 -->
    <circle id="bubble-2" cx="-1" cy="-7" r="1.8" fill="#FEF08A" stroke="#F59E0B" stroke-width="0.4" opacity="0"/>
    <!-- 佛系小问号 -->
    <g id="think-q" opacity="0">
      <text x="2" y="-10" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5" font-weight="bold" fill="url(#gold-q-grad)" stroke="#78350F" stroke-width="0.3" text-anchor="middle">?</text>
    </g>
  </g>
</svg>
