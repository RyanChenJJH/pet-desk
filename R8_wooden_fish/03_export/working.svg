<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fish-wood-grad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="92%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <linearGradient id="fish-tail-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <radialGradient id="mallet-head-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>

    <linearGradient id="mallet-handle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gold-text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <style>
    /* 小木槌敲击动画 (1.0s 循环敲击两次，每次 0.5s) */
    @keyframes mallet-strike {
      0%, 100% {
        transform: translate(0px, 0px) rotate(-15deg);
      }
      10% {
        transform: translate(2px, -3px) rotate(-35deg); /* 高高扬起 */
      }
      22% {
        transform: translate(-7px, 3px) rotate(16deg);  /* 猛力击中木鱼头顶 */
      }
      28% {
        transform: translate(-3px, 0px) rotate(-5deg);  /* 受力弹起 */
      }
      50% {
        transform: translate(0px, 0px) rotate(-15deg);  /* 恢复中位准备下一击 */
      }
      60% {
        transform: translate(2px, -3px) rotate(-35deg); /* 第二次高扬 */
      }
      72% {
        transform: translate(-7px, 3px) rotate(16deg);  /* 第二次击中 */
      }
      78% {
        transform: translate(-3px, 0px) rotate(-5deg);  /* 受力弹起 */
      }
    }

    /* 木鱼受击向下弹性压扁 (Squash and Stretch) */
    @keyframes fish-hit {
      0%, 50%, 100% {
        transform: scale(1.0, 1.0);
      }
      22%, 72% {
        transform: scale(1.06, 0.91); /* 击中瞬间压扁 */
      }
      28%, 78% {
        transform: scale(0.97, 1.03); /* 反弹回震 */
      }
      38%, 88% {
        transform: scale(1.0, 1.0);
      }
    }

    /* 地面阴影同步微颤 */
    @keyframes shadow-hit {
      0%, 50%, 100% {
        transform: scale(1.0, 1.0);
        opacity: 0.2;
      }
      22%, 72% {
        transform: scale(1.10, 1.06);
        opacity: 0.28;
      }
      35%, 85% {
        transform: scale(1.0, 1.0);
        opacity: 0.2;
      }
    }

    /* 敲击瞬间圆眼变成享受的微笑月牙眼 */
    @keyframes eyes-switch-round {
      0%, 18%, 32%, 50%, 68%, 82%, 100% {
        opacity: 1;
      }
      22%, 28%, 72%, 78% {
        opacity: 0;
      }
    }
    @keyframes eyes-switch-smile {
      0%, 18%, 32%, 50%, 68%, 82%, 100% {
        opacity: 0;
      }
      22%, 28%, 72%, 78% {
        opacity: 1;
      }
    }

    /* 敲击金色冲击光环 1 */
    @keyframes ring-expand-1 {
      0%, 20% {
        transform: scale(0.2);
        opacity: 0;
      }
      23% {
        opacity: 0.9;
      }
      45%, 100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* 敲击金色冲击光环 2 */
    @keyframes ring-expand-2 {
      0%, 70% {
        transform: scale(0.2);
        opacity: 0;
      }
      73% {
        opacity: 0.9;
      }
      95%, 100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* 升腾“功德+1”文字 1 */
    @keyframes merit-float-1 {
      0%, 20% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      25% {
        transform: translateY(-4px) scale(1.1);
        opacity: 1;
      }
      50%, 100% {
        transform: translateY(-16px) scale(0.9);
        opacity: 0;
      }
    }

    /* 升腾“功德+1”文字 2 */
    @keyframes merit-float-2 {
      0%, 70% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      75% {
        transform: translateY(-4px) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translateY(-16px) scale(0.9);
        opacity: 0;
      }
    }

    #fish-body-working {
      transform-origin: 0px 17.5px;
      animation: fish-hit 1.0s ease-out infinite;
    }

    #shadow-working {
      transform-origin: 0px 17.5px;
      animation: shadow-hit 1.0s ease-out infinite;
    }

    #mallet-working {
      transform-origin: 12px 3px;
      animation: mallet-strike 1.0s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }

    #eyes-normal {
      animation: eyes-switch-round 1.0s step-end infinite;
    }

    #eyes-smile {
      animation: eyes-switch-smile 1.0s step-end infinite;
    }

    #strike-ring-1 {
      transform-origin: 0px -2px;
      animation: ring-expand-1 1.0s ease-out infinite;
    }

    #strike-ring-2 {
      transform-origin: 0px -2px;
      animation: ring-expand-2 1.0s ease-out infinite;
    }

    #merit-text-1 {
      animation: merit-float-1 1.0s ease-out infinite;
    }

    #merit-text-2 {
      animation: merit-float-2 1.0s ease-out infinite;
    }
  </style>

  <!-- 1. 地面投影层 -->
  <g id="shadow-js">
    <g id="shadow-working">
      <ellipse cx="0" cy="17.5" rx="11" ry="2.4" fill="rgba(60,26,6,0.2)"/>
    </g>
  </g>

  <!-- 2. 木鱼主体躯干层 -->
  <g id="body-js">
    <g id="fish-body-working">
      <!-- 卷尾 -->
      <path id="fish-tail" d="M -9 6 C -12 3, -15 7, -13 11 C -11.5 13.5, -8 13.5, -7 11 C -8 9.5, -8 7.5, -9 6 Z"
            fill="url(#fish-tail-grad)" stroke="#3C1A06" stroke-width="0.8" stroke-linejoin="round"/>

      <!-- 主球体 -->
      <path id="fish-shell" d="M -10 11 C -11 6, -9 -1, -2 -3 C 3 -4.5, 9 -2, 11 4 C 12.5 8, 12 13, 8 16 C 4 17.5, -5 17.5, -9 15 C -10.5 13.8, -10.5 12.2, -10 11 Z"
            fill="url(#fish-wood-grad)" stroke="#3C1A06" stroke-width="0.9" stroke-linejoin="round"/>

      <!-- 顶部高光弧 -->
      <path d="M -5 -0.5 C -1 -2, 4 -2, 7 1.5"
            fill="none" stroke="#FEF3C7" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>

      <!-- 雕刻纹线 -->
      <g id="carved-lines" opacity="0.55">
        <path d="M -7 4 C -5 2, -1 2, 1 3.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
        <path d="M 3 2.5 C 5 2.5, 8 4, 9 6.5" fill="none" stroke="#78350F" stroke-width="0.65" stroke-linecap="round"/>
      </g>

      <!-- 发音横缝 -->
      <g id="fish-slit">
        <path d="M -6.5 12.5 Q 0 14.5 7.5 12 Q 9 12 9.5 13 Q 9 14.2 7 14.5 Q 0 16 -6.5 14 Q -8 13.5 -8 12.8 Z"
              fill="#451A03" stroke="#3C1A06" stroke-width="0.6"/>
        <circle cx="-6.2" cy="13.2" r="1.1" fill="#2E1002"/>
        <circle cx="7.2" cy="13.2" r="1.1" fill="#2E1002"/>
      </g>

      <!-- 腮红 -->
      <g id="blush">
        <ellipse cx="-6" cy="8.2" rx="1.6" ry="1.0" fill="rgba(244,63,94,0.48)"/>
        <ellipse cx="6" cy="8.2" rx="1.6" ry="1.0" fill="rgba(244,63,94,0.48)"/>
      </g>

      <!-- 双眼组 (圆眼与月牙笑眼动态交替) -->
      <g id="eyes-js">
        <!-- 正常呆萌圆眼 -->
        <g id="eyes-normal">
          <g id="eye-left">
            <circle cx="-3.6" cy="6.2" r="1.7" fill="#18181B"/>
            <circle cx="-4.2" cy="5.6" r="0.6" fill="#FFFFFF"/>
            <circle cx="-3.0" cy="7.0" r="0.25" fill="#FFFFFF" opacity="0.8"/>
          </g>
          <g id="eye-right">
            <circle cx="3.6" cy="6.2" r="1.7" fill="#18181B"/>
            <circle cx="3.0" cy="5.6" r="0.6" fill="#FFFFFF"/>
            <circle cx="4.2" cy="7.0" r="0.25" fill="#FFFFFF" opacity="0.8"/>
          </g>
        </g>
        <!-- 击中时的享受笑眼 -->
        <g id="eyes-smile" opacity="0">
          <path d="M -5.2 6.5 Q -3.6 8.0 -2.0 6.5" fill="none" stroke="#18181B" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M 2.0 6.5 Q 3.6 8.0 5.2 6.5" fill="none" stroke="#18181B" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 3. 悬浮敲击小木槌层 -->
  <g id="mallet-js">
    <g id="mallet-working">
      <ellipse cx="10" cy="16.5" rx="3.5" ry="1.0" fill="rgba(60,26,6,0.12)"/>
      <path d="M 9.5 3 L 13 -7.5" stroke="url(#mallet-handle-grad)" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="11.2" y="-4" width="2" height="1.2" rx="0.5" fill="#DC2626" transform="rotate(-65 12 -3.5)"/>
      <ellipse cx="8.5" cy="-3.5" rx="3.2" ry="2.4" fill="url(#mallet-head-grad)" stroke="#3C1A06" stroke-width="0.75" transform="rotate(-25 8.5 -3.5)"/>
      <circle cx="7.8" cy="-4.2" r="0.7" fill="#FEF3C7" opacity="0.75"/>
    </g>
  </g>

  <!-- 4. 浮空功德光效层 (#effects-js) -->
  <g id="effects-js">
    <!-- 敲击冲击金色光环 -->
    <circle id="strike-ring-1" cx="0" cy="-2" r="3.5" fill="none" stroke="#FBBF24" stroke-width="0.8" opacity="0"/>
    <circle id="strike-ring-2" cx="0" cy="-2" r="3.5" fill="none" stroke="#FBBF24" stroke-width="0.8" opacity="0"/>

    <!-- 升腾的“功德+1”文字 -->
    <g id="merit-text-1" opacity="0">
      <text x="-4" y="-8" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="4.2" font-weight="900" fill="url(#gold-text-grad)" stroke="#78350F" stroke-width="0.4" text-anchor="middle">功德+1</text>
    </g>
    <g id="merit-text-2" opacity="0">
      <text x="3" y="-8" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="4.2" font-weight="900" fill="url(#gold-text-grad)" stroke="#78350F" stroke-width="0.4" text-anchor="middle">功德+1</text>
    </g>
  </g>
</svg>
