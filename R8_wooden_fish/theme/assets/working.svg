<svg viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fish-wood-grad" cx="42%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="25%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#92400E"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>

    <linearGradient id="fish-handle-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <radialGradient id="cushion-silk-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="80%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>

    <linearGradient id="gold-brocade-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="mallet-head-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>

    <linearGradient id="mallet-handle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gold-plus-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <style>
    /* 高频沉浸敲击动画 (0.8s 周期双击，每 0.4s 一击) */
    @keyframes mallet-work-strike {
      0%, 100% {
        transform: translate(2px, -3px) rotate(-32deg);
      }
      10% {
        transform: translate(3px, -5px) rotate(-42deg);
      }
      22% {
        transform: translate(-7px, 3px) rotate(16deg); /* 第 1 击 */
      }
      30% {
        transform: translate(-2px, -1px) rotate(-10deg);
      }
      50% {
        transform: translate(2px, -3px) rotate(-32deg);
      }
      60% {
        transform: translate(3px, -5px) rotate(-42deg);
      }
      72% {
        transform: translate(-7px, 3px) rotate(16deg); /* 第 2 击 */
      }
      80% {
        transform: translate(-2px, -1px) rotate(-10deg);
      }
    }

    /* 木鱼与蒲团高频下陷回弹 */
    @keyframes fish-work-hit {
      0%, 50%, 100% {
        transform: translateY(0px) scale(1.0, 1.0);
      }
      22%, 72% {
        transform: translateY(1.2px) scale(1.04, 0.92);
      }
      32%, 82% {
        transform: translateY(-0.3px) scale(0.98, 1.02);
      }
    }

    @keyframes cushion-work-hit {
      0%, 50%, 100% {
        transform: scale(1.0, 1.0);
      }
      22%, 72% {
        transform: scale(1.05, 0.94);
      }
      32%, 82% {
        transform: scale(0.99, 1.01);
      }
    }

    /* 金色音波涟漪 1 与 2 */
    @keyframes work-ripple-1 {
      0%, 20% {
        transform: scale(0.2);
        opacity: 0;
      }
      23% {
        opacity: 0.9;
      }
      48%, 100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    @keyframes work-ripple-2 {
      0%, 70% {
        transform: scale(0.2);
        opacity: 0;
      }
      73% {
        opacity: 0.9;
      }
      98%, 100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* 升腾“+1”文字 1 与 2 */
    @keyframes work-plus-1 {
      0%, 20% {
        transform: translate(0px, 0px) scale(0.5);
        opacity: 0;
      }
      25% {
        transform: translate(1px, -3px) scale(1.15);
        opacity: 1;
      }
      50%, 100% {
        transform: translate(2.5px, -14px) scale(0.9);
        opacity: 0;
      }
    }

    @keyframes work-plus-2 {
      0%, 70% {
        transform: translate(0px, 0px) scale(0.5);
        opacity: 0;
      }
      75% {
        transform: translate(1px, -3px) scale(1.15);
        opacity: 1;
      }
      100% {
        transform: translate(2.5px, -14px) scale(0.9);
        opacity: 0;
      }
    }

    #mallet-work {
      transform-origin: 11px -2px;
      animation: mallet-work-strike 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) infinite;
    }

    #fish-work {
      transform-origin: 0px 14.5px;
      animation: fish-work-hit 0.8s ease-out infinite;
    }

    #cushion-work {
      transform-origin: 0px 16px;
      animation: cushion-work-hit 0.8s ease-out infinite;
    }

    #ripple-1 {
      transform-origin: 0px -2px;
      animation: work-ripple-1 0.8s ease-out infinite;
    }

    #ripple-2 {
      transform-origin: 0px -2px;
      animation: work-ripple-2 0.8s ease-out infinite;
    }

    #plus-1 {
      animation: work-plus-1 0.8s ease-out infinite;
    }

    #plus-2 {
      animation: work-plus-2 0.8s ease-out infinite;
    }
  </style>

  <!-- 1. 地面柔和阴影 (#shadow-js) -->
  <g id="shadow-js" style="transform-origin: 0px 18px">
    <ellipse cx="0" cy="18" rx="13" ry="2.2" fill="rgba(28,10,0,0.22)"/>
  </g>

  <!-- 2. 朱红金边锦缎蒲团底座 -->
  <g id="cushion-base">
    <g id="cushion-work">
      <ellipse cx="0" cy="15.8" rx="12.5" ry="3.2" fill="#7F1D1D"/>
      <ellipse cx="0" cy="14.8" rx="12" ry="3.0" fill="url(#cushion-silk-grad)" stroke="#451A03" stroke-width="0.6"/>
      <path d="M -11 14.8 Q -6 16.5 0 16.5 Q 6 16.5 11 14.8" fill="none" stroke="url(#gold-brocade-grad)" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -8 15.2 Q -4 16.8 0 16.8 Q 4 16.8 8 15.2" fill="none" stroke="#7F1D1D" stroke-width="0.5"/>
      <line x1="0" y1="16.5" x2="0" y2="18.2" stroke="#F59E0B" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="0" cy="16.3" r="0.8" fill="#FEF08A"/>
    </g>
  </g>

  <!-- 3. 正宗法器木鱼主体躯干层 (#body-js) -->
  <g id="body-js">
    <g id="fish-work">
      <!-- 卷尾提梁 -->
      <g id="fish-handle">
        <path d="M -6 5.5 C -9.5 2, -14 5, -13.5 10 C -13 13.5, -9 14.5, -6 12 C -7.5 10.5, -7.5 8, -6 5.5 Z"
              fill="url(#fish-handle-grad)" stroke="#260C02" stroke-width="0.8" stroke-linejoin="round"/>
        <path d="M -8 6.8 C -10.5 5, -11.8 7, -11.5 9.5 C -11.2 11.2, -9.5 11.8, -8 10.5 C -8.8 9.5, -8.8 8, -8 6.8 Z"
              fill="#7F1D1D" stroke="#260C02" stroke-width="0.5"/>
      </g>

      <!-- 饱满鱼腹共鸣腔体 -->
      <path id="fish-main-dome"
            d="M -7 11.5 C -8.5 4, -5 -3.5, 0 -4 C 5 -4.5, 9.8 -1.5, 10.5 4.5 C 11 8.5, 9.5 13, 5 14 C 0 14.8, -5 14.5, -7 11.5 Z"
            fill="url(#fish-wood-grad)" stroke="#260C02" stroke-width="0.9" stroke-linejoin="round"/>

      <!-- 顶部高光弧面 -->
      <path d="M -4 -1.5 C -1 -3, 3 -3, 6 0.5"
            fill="none" stroke="#FEF3C7" stroke-width="0.9" stroke-linecap="round" opacity="0.65"/>

      <!-- 背脊双层立体浮雕鱼鳞云纹雕花 -->
      <g id="carved-motifs">
        <path d="M -4 1 C -1 -1.2, 4 -0.8, 6.5 2" fill="none" stroke="#260C02" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M -4 0.6 C -1 -1.6, 4 -1.2, 6.5 1.6" fill="none" stroke="#FEF3C7" stroke-width="0.5" stroke-linecap="round" opacity="0.75"/>
        <path d="M -5 4.8 C -1 2.8, 4 3.2, 7.5 5.8" fill="none" stroke="#260C02" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M -5 4.4 C -1 2.4, 4 2.8, 7.5 5.4" fill="none" stroke="#FEF3C7" stroke-width="0.5" stroke-linecap="round" opacity="0.75"/>
        <path d="M -3 8.2 C 0 6.6, 3.5 6.8, 6.5 9" fill="none" stroke="#260C02" stroke-width="0.7" stroke-linecap="round"/>
        <path d="M -3 7.8 C 0 6.2, 3.5 6.4, 6.5 8.6" fill="none" stroke="#D97706" stroke-width="0.5" stroke-linecap="round" opacity="0.8"/>
      </g>

      <!-- 贯穿侧面的镂空发音横槽与共鸣孔 -->
      <g id="sound-slit">
        <path d="M -4.5 11.5 Q 1 12.8 8 10.2 Q 8.8 10.8 7.5 11.8 Q 1 14 -4.5 12.8 Z"
              fill="#1C0A00" stroke="#260C02" stroke-width="0.6"/>
        <circle cx="-4.2" cy="12.0" r="1.3" fill="#1C0A00" stroke="#260C02" stroke-width="0.6"/>
        <circle cx="7.8" cy="10.8" r="1.6" fill="#1C0A00" stroke="#260C02" stroke-width="0.6"/>
        <path d="M -4.2 10.8 Q 1 12.0 7.8 9.5" fill="none" stroke="#FEF3C7" stroke-width="0.6" stroke-linecap="round" opacity="0.65"/>
      </g>
    </g>
  </g>

  <!-- 4. 高频敲击木槌层 (#mallet-js) -->
  <g id="mallet-js">
    <g id="mallet-work">
      <path d="M 10 4 L 14 -8" stroke="url(#mallet-handle-grad)" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="12" y="-4" width="2.2" height="1.4" rx="0.5" fill="#DC2626" transform="rotate(-68 13 -3.5)"/>
      <ellipse cx="8.8" cy="-4" rx="3.5" ry="2.6" fill="url(#mallet-head-grad)" stroke="#260C02" stroke-width="0.8" transform="rotate(-28 8.8 -4)"/>
      <circle cx="8.0" cy="-4.8" r="0.8" fill="#FEF3C7" opacity="0.8"/>
    </g>
  </g>

  <!-- 5. 密集金色震波与连发“+1”升腾消散层 (#effects-js) -->
  <g id="effects-js">
    <circle id="ripple-1" cx="0" cy="-2" r="3.2" fill="none" stroke="#FBBF24" stroke-width="0.75" opacity="0"/>
    <circle id="ripple-2" cx="0" cy="-2" r="3.2" fill="none" stroke="#FBBF24" stroke-width="0.75" opacity="0"/>

    <g id="plus-1" opacity="0">
      <text x="4.5" y="-1" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5" font-weight="900" fill="url(#gold-plus-grad)" stroke="#78350F" stroke-width="0.35" text-anchor="middle">+1</text>
    </g>
    <g id="plus-2" opacity="0">
      <text x="7.5" y="-2" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5" font-weight="900" fill="url(#gold-plus-grad)" stroke="#78350F" stroke-width="0.35" text-anchor="middle">+1</text>
    </g>
  </g>
</svg>
